<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<title>Vertical Climb</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow:hidden;background:#0b1026;color:#fff;font-family:-apple-system,Segoe UI,Roboto,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none;}
  #game{position:fixed;inset:0;}
  #hud,.pedal,#pauseBtn{display:none;}
  body.playing #hud{display:flex;}
  body.playing .pedal{display:flex;}
  body.playing #pauseBtn{display:flex;}
  #hud{position:fixed;top:0;left:0;right:0;padding:10px 14px;justify-content:space-between;align-items:flex-start;text-shadow:0 1px 3px #000;pointer-events:none;font-weight:600;font-size:14px;z-index:5;}
  #hud .col{display:flex;flex-direction:column;gap:6px;}
  #fuelbar{width:120px;height:10px;border-radius:6px;background:rgba(255,255,255,.25);overflow:hidden;}
  #fuelfill{height:100%;width:100%;background:linear-gradient(90deg,#ff5f6d,#ffc371);transition:width .15s;}
  #speedbox{padding:4px 10px;border-radius:10px;background:rgba(0,0,0,.35);}
  #speedbox.ok{background:rgba(46,204,113,.6);}
  #pauseBtn{position:fixed;top:10px;left:50%;transform:translateX(-50%);width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.4);align-items:center;justify-content:center;font-size:20px;z-index:7;pointer-events:auto;border:none;color:#fff;}
  .pedal{position:fixed;bottom:0;width:50%;height:36%;z-index:6;align-items:center;justify-content:center;font-size:44px;color:rgba(255,255,255,.85);}
  #brake{left:0;background:linear-gradient(0deg,rgba(231,76,60,.30),transparent);}
  #gas{right:0;background:linear-gradient(0deg,rgba(46,204,113,.30),transparent);}
  .pedal:active{filter:brightness(1.4);}
  .screen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:22px;}
  .hidden{display:none!important;}
  #boot{background:#0b1026;}
  .logo{font-size:34px;font-weight:800;letter-spacing:2px;background:linear-gradient(90deg,#ffc371,#ff9f43);-webkit-background-clip:text;background-clip:text;color:transparent;}
  #bootbar{width:200px;height:8px;border-radius:6px;background:rgba(255,255,255,.15);overflow:hidden;}
  #bootfill{height:100%;width:0%;background:linear-gradient(90deg,#ffc371,#ff9f43);transition:width .2s;}
  #menu{background:rgba(6,10,25,.55);backdrop-filter:blur(2px);justify-content:space-between;padding:26px 18px;}
  #menu .top{display:flex;flex-direction:column;align-items:center;gap:6px;}
  #best{opacity:.85;font-size:14px;}
  .carcard{width:100%;max-width:360px;background:rgba(0,0,0,.35);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:12px;}
  .carrow{display:flex;align-items:center;justify-content:space-between;}
  .arrow{width:46px;height:46px;border-radius:50%;border:none;background:rgba(255,255,255,.14);color:#fff;font-size:22px;}
  .carprev{display:flex;flex-direction:column;align-items:center;gap:4px;}
  #carCanvas{width:150px;height:84px;}
  .carname{font-weight:700;font-size:18px;}
  .stats{display:flex;flex-direction:column;gap:6px;}
  .stat{display:flex;align-items:center;gap:8px;font-size:12px;}
  .stat .lbl{width:74px;opacity:.8;text-align:left;}
  .bar{flex:1;height:8px;border-radius:5px;background:rgba(255,255,255,.15);overflow:hidden;}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#4facfe,#43e97b);}
  .biomes{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:380px;}
  .chip{padding:8px 12px;border-radius:20px;background:rgba(255,255,255,.12);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid transparent;min-width:70px;}
  .chip.sel{border-color:#ffc371;background:rgba(255,159,67,.22);}
  .chip .wx{font-size:10px;opacity:.7;}
  .dot{width:12px;height:12px;border-radius:50%;}
  .btn{padding:15px 46px;border:none;border-radius:16px;font-size:19px;font-weight:800;color:#0b1026;background:linear-gradient(90deg,#ffc371,#ff9f43);box-shadow:0 8px 24px rgba(255,159,67,.4);}
  .btn.ghost{background:rgba(255,255,255,.16);color:#fff;box-shadow:none;font-weight:700;}
  #count{background:transparent;pointer-events:none;}
  #countnum{font-size:96px;font-weight:900;text-shadow:0 4px 20px rgba(0,0,0,.6);}
  #pause{background:rgba(6,10,25,.75);}
  #over{background:rgba(6,10,25,.82);}
  #over h1{font-size:30px;margin:0;}
  #over p{opacity:.85;max-width:300px;line-height:1.5;margin:0;}
  .rowbtns{display:flex;gap:12px;}
</style>
</head>
<body>
<div id="game"></div>

<div id="hud">
  <div class="col">
    <div>⛰️ <span id="alt">0</span> м</div>
    <div>🪙 <span id="coins">0</span></div>
    <div id="fuelbar"><div id="fuelfill"></div></div>
  </div>
  <div class="col" style="align-items:flex-end">
    <div id="speedbox"><span id="spd">0</span> км/ч</div>
    <div style="opacity:.7">цель: <span id="optspd">0</span></div>
  </div>
</div>
<button id="pauseBtn">⏸</button>
<div id="brake" class="pedal">◀</div>
<div id="gas" class="pedal">▶</div>

<div id="boot" class="screen">
  <div class="logo">VERTICAL CLIMB</div>
  <div style="opacity:.7;font-size:13px">Загрузка…</div>
  <div id="bootbar"><div id="bootfill"></div></div>
</div>

<div id="menu" class="screen hidden">
  <div class="top">
    <div class="logo">VERTICAL CLIMB</div>
    <div id="best">Рекорд: 0 м</div>
  </div>
  <div class="carcard">
    <div class="carrow">
      <button class="arrow" id="prevCar">‹</button>
      <div class="carprev">
        <canvas id="carCanvas" width="150" height="84"></canvas>
        <div class="carname" id="carName">Jeep 4x4</div>
      </div>
      <button class="arrow" id="nextCar">›</button>
    </div>
    <div class="stats" id="stats"></div>
  </div>
  <div class="biomes" id="biomes"></div>
  <button class="btn" id="playBtn">ИГРАТЬ</button>
</div>

<div id="count" class="screen hidden"><div id="countnum">3</div></div>

<div id="pause" class="screen hidden">
  <h1>Пауза</h1>
  <div class="rowbtns">
    <button class="btn ghost" id="pMenuBtn">В меню</button>
    <button class="btn" id="resumeBtn">Продолжить</button>
  </div>
</div>

<div id="over" class="screen hidden">
  <h1 id="overTitle">ФИНИШ</h1>
  <p id="overText"></p>
  <div class="rowbtns">
    <button class="btn ghost" id="menuBtn">Меню</button>
    <button class="btn" id="retryBtn">Заново</button>
  </div>
</div>

<script>
const Matter = Phaser.Physics.Matter.Matter;
const STEP=60, COUNT=820;

/* ---------- МАШИНЫ (физика + внешний вид) ---------- */
const CARS=[
  {id:'jeep', name:'Jeep 4x4', color:0x2e86de, roof:0x1e5fa0, glass:0xbfe6ff,
   torque:0.030, maxW:0.60, density:0.0044, grip:0.98, susp:0.68, damp:0.08, fuelUse:6, wheel:28, frontDrive:0.5,
   bw:118, bh:30, cab:{x:-2,w:60,h:24},
   stats:{Мощность:3,Скорость:3,Сцепление:4,Топливо:3}},
  {id:'sport', name:'Sport GT', color:0xe74c3c, roof:0xb83227, glass:0xffd6c8,
   torque:0.034, maxW:0.74, density:0.0038, grip:0.82, susp:0.50, damp:0.06, fuelUse:7, wheel:22, frontDrive:0.15,
   bw:134, bh:22, cab:{x:-8,w:52,h:16},
   stats:{Мощность:4,Скорость:5,Сцепление:2,Топливо:2}},
  {id:'monster', name:'Monster', color:0x27ae60, roof:0x1e8449, glass:0xcaf7d8,
   torque:0.036, maxW:0.56, density:0.0062, grip:1.10, susp:0.82, damp:0.10, fuelUse:8, wheel:36, frontDrive:0.6,
   bw:112, bh:34, cab:{x:0,w:58,h:26},
   stats:{Мощность:5,Скорость:2,Сцепление:5,Топливо:1}},
  {id:'eco', name:'Eco Buggy', color:0xf39c12, roof:0xc87f0a, glass:0xffe9b8,
   torque:0.028, maxW:0.60, density:0.0040, grip:0.92, susp:0.60, damp:0.08, fuelUse:4, wheel:26, frontDrive:0.4,
   bw:110, bh:28, cab:{x:-2,w:54,h:22},
   stats:{Мощность:2,Скорость:3,Сцепление:3,Топливо:5}}
];

/* ---------- БИОМЫ (рельеф + физика + погода) ---------- */
const BIOMES=[
  {name:'Луга',    dot:'#4caf50', bgTop:'#7ec8ff', bgBot:'#dff6ff', ground:0x6b4a2b, grass:0x4caf50, gravity:1.15, ascend:0.34, amp:290, friction:1.00, sky:'day',   rough:0.9, roughAmp:16, weather:'clear', wxName:'ясно'},
  {name:'Пустыня', dot:'#e0a458', bgTop:'#ffb36b', bgBot:'#ffe6b3', ground:0xc2853f, grass:0xe0a458, gravity:1.12, ascend:0.31, amp:250, friction:0.82, sky:'day',   rough:0.28,roughAmp:60, weather:'sand',  wxName:'песок'},
  {name:'Снега',   dot:'#cfe8ff', bgTop:'#bcd4e6', bgBot:'#f5fbff', ground:0x8fa6b5, grass:0xffffff, gravity:1.15, ascend:0.29, amp:230, friction:0.58, sky:'day',   rough:0.12,roughAmp:20, weather:'snow',  wxName:'снег'},
  {name:'Каньон',  dot:'#c0392b', bgTop:'#7b2d3a', bgBot:'#e0794b', ground:0x8c3b2b, grass:0xcf5c3a, gravity:1.20, ascend:0.40, amp:360, friction:1.00, sky:'dusk',  rough:1.1, roughAmp:38, weather:'rain',  wxName:'дождь'},
  {name:'Космос',  dot:'#8e7dff', bgTop:'#0a0a2a', bgBot:'#241b4d', ground:0x3a2d5c, grass:0x8e7dff, gravity:0.70, ascend:0.42, amp:420, friction:0.90, sky:'night', rough:0.7, roughAmp:30, weather:'stars', wxName:'звёзды'}
];

const SEL={car:0, biome:0};
let CAR, BIOME;
let terrain=[], chassis, wheelB, wheelF, group;
let bodyGfx, wheelGfx, terrainGfx, dust, weatherEmitter, sceneRef;
let onGround=false, lastGround=-9999, flipTimer=0, crashTilt=false;
let running=false, dead=false, paused=false;
let fuel=100, coins=0, startY=0, maxAlt=0;
let gasBtn=false, brakeBtn=false, pickups=[];

const BEST_KEY='vc_best';
function getBest(){ return parseInt(localStorage.getItem(BEST_KEY)||'0',10)||0; }
function setBest(v){ if(v>getBest()){ localStorage.setItem(BEST_KEY,String(v)); try{window.Telegram&&window.Telegram.WebApp&&window.Telegram.WebApp.CloudStorage&&window.Telegram.WebApp.CloudStorage.setItem(BEST_KEY,String(v));}catch(e){} } }
function applyBiomeBg(b){ document.body.style.background='linear-gradient(180deg,'+b.bgTop+' 0%,'+b.bgBot+' 100%)'; }

/* ---------- ГЕНЕРАЦИЯ ТРАССЫ ---------- */
function generateTerrain(){
  terrain=[];
  const p=BIOME;
  for(let i=0;i<COUNT;i++){
    const x=i*STEP;
    const growth=1+i/COUNT;
    let y=-(x*p.ascend);
    y+=Math.sin(i*0.065)*p.amp;
    y+=Math.sin(i*0.24+0.7)*0.42*p.amp;
    y+=Math.sin(i*0.5+1.3)*42;
    y+=Math.sin(i*p.rough)*p.roughAmp;
    terrain.push({x, y:y*growth});
  }
  const eMu=Math.min(CAR.grip, BIOME.friction);
  const maxUp=STEP*Math.min(0.55, eMu*0.9);
  const maxDown=STEP*1.35;
  for(let i=1;i<terrain.length;i++){
    const prev=terrain[i-1].y; let y=terrain[i].y;
    const rise=prev-y;
    if(rise>maxUp) y=prev-maxUp;
    else if(rise<-maxDown) y=prev+maxDown;
    terrain[i].y=y;
  }
}

const config={
  type:Phaser.AUTO, parent:'game', transparent:true,
  scale:{mode:Phaser.Scale.RESIZE, autoCenter:Phaser.Scale.CENTER_BOTH},
  physics:{default:'matter', matter:{gravity:{x:0,y:1.15}, enableSleeping:false}},
  scene:[{key:'Game', active:false, create, update}]
};
const game=new Phaser.Game(config);

function create(){
  sceneRef=this;
  CAR=CARS[SEL.car]; BIOME=BIOMES[SEL.biome];
  onGround=false; lastGround=-9999; flipTimer=0; crashTilt=false;
  dead=false; running=false; paused=false;
  fuel=100; coins=0; maxAlt=0; pickups=[]; gasBtn=false; brakeBtn=false;
  this.matter.world.setGravity(0, BIOME.gravity);
  this.matter.world.off('collisionactive');

  const W=this.scale.width;
  let g=this.add.graphics();
  g.fillStyle(0xffffff,1); g.fillCircle(9,9,9); g.generateTexture('dust',18,18); g.clear();
  g.fillStyle(0xffffff,0.95); g.fillEllipse(70,26,140,52); g.fillEllipse(40,32,80,40); g.fillEllipse(105,34,80,40); g.generateTexture('cloud',150,64); g.clear();
  g.fillStyle(0xffffff,1); g.fillCircle(3,3,3); g.generateTexture('flake',6,6); g.clear();
  g.fillStyle(0xffffff,1); g.fillRect(0,0,2,11); g.generateTexture('drop',2,11); g.destroy();

  generateTerrain();
  startY=terrain[4].y;

  // небо: солнце/луна + параллакс-горы
  const night=BIOME.sky==='night';
  const sun=this.add.circle(W*0.22, 120, night?34:46, night?0xf6f2d0:0xfff2a8, night?0.9:0.95);
  sun.setScrollFactor(0.05).setDepth(-12);
  for(let layer=0;layer<2;layer++){
    const mg=this.add.graphics().setScrollFactor(0.2+layer*0.18).setDepth(-11+layer);
    const tint=layer===0?0x3a4a6b:0x4c5f86;
    mg.fillStyle(tint, night?0.5:0.4);
    mg.beginPath(); mg.moveTo(-200, startY+400);
    for(let x=-200;x<COUNT*STEP;x+=260){ mg.lineTo(x, startY-Phaser.Math.Between(120,360)-layer*80); mg.lineTo(x+130, startY+400); }
    mg.lineTo(COUNT*STEP, startY+400); mg.closePath(); mg.fillPath();
  }
  const bgTex = night?'flake':'cloud';
  for(let i=0;i<60;i++){
    const s=this.add.image(Phaser.Math.Between(0,COUNT*STEP), Phaser.Math.Between(startY-COUNT*STEP*0.6, startY+400), bgTex);
    s.setScrollFactor(night?0.15:0.4).setDepth(-10).setAlpha(night?Phaser.Math.FloatBetween(0.4,1):Phaser.Math.FloatBetween(0.22,0.55)).setScale(night?Phaser.Math.FloatBetween(0.5,1.6):Phaser.Math.FloatBetween(0.6,1.5));
  }

  // рельеф
  terrainGfx=this.add.graphics().setDepth(1); drawTerrain();
  for(let i=0;i<terrain.length-1;i++){
    const a=terrain[i], b=terrain[i+1], dx=b.x-a.x, dy=b.y-a.y;
    this.matter.add.rectangle(a.x+dx/2, a.y+dy/2+20, Math.hypot(dx,dy)+2, 44, {isStatic:true, angle:Math.atan2(dy,dx), friction:BIOME.friction, frictionStatic:1, label:'terrain'});
  }

  for(let i=8;i<terrain.length-4;i+=11) pickups.push({x:terrain[i].x, y:terrain[i].y-70, type:(i%22===8?'fuel':'coin'), got:false});

  // машина
  group=Matter.Body.nextGroup(true);
  const cx=terrain[4].x, cy=terrain[4].y-180, R=CAR.wheel;
  chassis=this.matter.add.rectangle(cx,cy,CAR.bw,CAR.bh+8,{collisionFilter:{group},chamfer:{radius:12},density:CAR.density,friction:0.1,label:'chassis'});
  wheelB=this.matter.add.circle(cx-46,cy+30,R,{collisionFilter:{group},density:0.0026,friction:CAR.grip,frictionStatic:1,label:'wheel'});
  wheelF=this.matter.add.circle(cx+46,cy+30,R,{collisionFilter:{group},density:0.0026,friction:CAR.grip,frictionStatic:1,label:'wheel'});
  this.matter.add.constraint(chassis, wheelB, 0, CAR.susp, {pointA:{x:-46,y:22}, damping:CAR.damp});
  this.matter.add.constraint(chassis, wheelF, 0, CAR.susp, {pointA:{x:46,y:22}, damping:CAR.damp});

  dust=this.add.particles(0,0,'dust',{lifespan:500,speed:{min:20,max:90},scale:{start:0.7,end:0},alpha:{start:0.6,end:0},tint:BIOME.ground,quantity:2,frequency:30,emitting:false}).setDepth(4);

  // погода
  weatherEmitter=null;
  if(BIOME.weather==='snow'){
    weatherEmitter=this.add.particles(0,0,'flake',{lifespan:5200,speedY:{min:40,max:90},speedX:{min:-25,max:15},scale:{min:0.3,max:0.9},alpha:{min:0.4,max:0.9},frequency:45,quantity:2,emitZone:{type:'random',source:new Phaser.Geom.Rectangle(-60,-20,W+120,10)}}).setScrollFactor(0).setDepth(60);
  } else if(BIOME.weather==='rain'){
    weatherEmitter=this.add.particles(0,0,'drop',{lifespan:1200,speedY:{min:520,max:700},speedX:{min:-60,max:-30},scaleY:{min:1,max:2},alpha:0.35,tint:0xbcd4ff,frequency:12,quantity:3,emitZone:{type:'random',source:new Phaser.Geom.Rectangle(-60,-20,W+220,10)}}).setScrollFactor(0).setDepth(60);
  } else if(BIOME.weather==='sand'){
    weatherEmitter=this.add.particles(0,0,'dust',{lifespan:2600,speedX:{min:120,max:220},speedY:{min:-10,max:30},scale:{min:0.4,max:1.1},alpha:{min:0.05,max:0.2},tint:0xe0c07a,frequency:40,quantity:2,emitZone:{type:'random',source:new Phaser.Geom.Rectangle(-80,0,10,this.scale.height)}}).setScrollFactor(0).setDepth(59);
  }

  wheelGfx=this.add.graphics().setDepth(5);
  bodyGfx=this.add.graphics().setDepth(6);

  this.matter.world.on('collisionactive',(e)=>{ for(const p of e.pairs){ const l1=p.bodyA.label,l2=p.bodyB.label;
    if((l1==='wheel'&&l2==='terrain')||(l2==='wheel'&&l1==='terrain')) lastGround=this.time.now;
    if((l1==='chassis'&&l2==='terrain')||(l2==='chassis'&&l1==='terrain')){ if(Math.abs(Phaser.Math.Angle.Wrap(chassis.angle))>1.35) crashTilt=true; } } });

  this.cameras.main.setZoom(0.82); this.cameras.main.centerOn(cx,cy);

  this.input.keyboard.removeAllListeners();
  this.input.keyboard.on('keydown-RIGHT',()=>gasBtn=true); this.input.keyboard.on('keyup-RIGHT',()=>gasBtn=false);
  this.input.keyboard.on('keydown-UP',()=>gasBtn=true);    this.input.keyboard.on('keyup-UP',()=>gasBtn=false);
  this.input.keyboard.on('keydown-LEFT',()=>brakeBtn=true);this.input.keyboard.on('keyup-LEFT',()=>brakeBtn=false);
  this.input.keyboard.on('keydown-DOWN',()=>brakeBtn=true);this.input.keyboard.on('keyup-DOWN',()=>brakeBtn=false);

  startCountdown();
}

function drawTerrain(){
  const g=terrainGfx; g.clear();
  g.fillStyle(BIOME.ground,1); g.beginPath(); g.moveTo(terrain[0].x,terrain[0].y);
  for(const p of terrain) g.lineTo(p.x,p.y);
  const last=terrain[terrain.length-1];
  g.lineTo(last.x,last.y+5000); g.lineTo(terrain[0].x,terrain[0].y+5000); g.closePath(); g.fillPath();
  g.lineStyle(14,BIOME.grass,1); g.beginPath(); g.moveTo(terrain[0].x,terrain[0].y);
  for(const p of terrain) g.lineTo(p.x,p.y);
  g.strokePath();
}

function nearestIndex(x){ return Phaser.Math.Clamp(Math.round(x/STEP),0,terrain.length-4); }

function update(time,delta){
  if(!sceneRef||dead){ renderCar(); return; }
  const dt=delta/1000;
  onGround=(time-lastGround)<90;

  if(running){
    if(gasBtn){
      if(onGround){
        Matter.Body.setAngularVelocity(wheelB, Math.min(wheelB.angularVelocity+CAR.torque, CAR.maxW));
        Matter.Body.setAngularVelocity(wheelF, Math.min(wheelF.angularVelocity+CAR.torque*CAR.frontDrive, CAR.maxW));
      } else Matter.Body.setAngularVelocity(chassis, Math.max(chassis.angularVelocity-0.010, -0.26));
      fuel-=CAR.fuelUse*dt;
    }
    if(brakeBtn){
      if(onGround){
        Matter.Body.setAngularVelocity(wheelB, Math.max(wheelB.angularVelocity-CAR.torque, -CAR.maxW*0.55));
        Matter.Body.setAngularVelocity(wheelF, Math.max(wheelF.angularVelocity-CAR.torque, -CAR.maxW*0.55));
      } else Matter.Body.setAngularVelocity(chassis, Math.min(chassis.angularVelocity+0.010, 0.26));
    }
    fuel-=0.5*dt;
    if(fuel<=0){ fuel=0; return die('Кончилось топливо','Заправляйся на зелёных канистрах.'); }

    if(crashTilt) return die('Разбился','Кабина ударилась о землю — приземляйся на колёса.');
    const wa=Math.abs(Phaser.Math.Angle.Wrap(chassis.angle));
    if(wa>2.2){ flipTimer+=delta; if(flipTimer>1300) return die('Перевернулся','На крыше не поедешь. Выравнивайся в воздухе газом и тормозом.'); } else flipTimer=0;

    for(const pk of pickups){ if(pk.got) continue;
      if(Phaser.Math.Distance.Between(chassis.position.x,chassis.position.y,pk.x,pk.y)<58){ pk.got=true; if(pk.type==='fuel') fuel=Math.min(100,fuel+40); else coins++; } }
  }

  this.cameras.main.centerOn(chassis.position.x+50, chassis.position.y-130);
  const spd=Math.hypot(chassis.velocity.x,chassis.velocity.y);
  dust.setPosition(wheelB.position.x, wheelB.position.y);
  dust.emitting = running && onGround && spd>2 && gasBtn;

  maxAlt=Math.max(maxAlt, Math.floor((startY-chassis.position.y)/10));
  const kmh=Math.round(spd*2.6);
  const idx=nearestIndex(chassis.position.x);
  const slope=(terrain[idx+3].y-terrain[idx].y)/(terrain[idx+3].x-terrain[idx].x);
  const opt=Math.round(42 + Phaser.Math.Clamp(-slope,0,1.2)*55);
  document.getElementById('alt').textContent=maxAlt;
  document.getElementById('coins').textContent=coins;
  document.getElementById('spd').textContent=kmh;
  document.getElementById('optspd').textContent=opt;
  document.getElementById('fuelfill').style.width=fuel+'%';
  document.getElementById('speedbox').classList.toggle('ok', kmh>=opt-8 && kmh<=opt+14);

  renderCar();
}

/* ---------- ОТРИСОВКА МАШИНЫ ---------- */
function toWorld(ang,lx,ly){ const c=Math.cos(ang),s=Math.sin(ang); return {x:chassis.position.x+lx*c-ly*s, y:chassis.position.y+lx*s+ly*c}; }

function renderCar(){
  if(!chassis||!wheelGfx) return;
  const wg=wheelGfx; wg.clear();
  for(const pk of pickups){ if(pk.got) continue;
    if(pk.type==='coin'){ wg.fillStyle(0xffd54a,1); wg.fillCircle(pk.x,pk.y,13); wg.lineStyle(3,0xd4a017,1); wg.strokeCircle(pk.x,pk.y,13); }
    else { wg.fillStyle(0x2ecc71,1); wg.fillRoundedRect(pk.x-11,pk.y-15,22,30,5); wg.lineStyle(3,0x145a32,1); wg.strokeRoundedRect(pk.x-11,pk.y-15,22,30,5); } }
  const R=CAR.wheel;
  // тень
  wg.fillStyle(0x000000,0.16); wg.fillEllipse(chassis.position.x, Math.max(wheelB.position.y,wheelF.position.y)+R*0.7, CAR.bw+50, 24);
  // подвеска (стойки)
  const mounts=[{lx:-46,ly:6,w:wheelB},{lx:46,ly:6,w:wheelF}];
  for(const m of mounts){ const mp=toWorld(chassis.angle,m.lx,m.ly), wp=m.w.position;
    wg.lineStyle(8,0x30354a,1); wg.beginPath(); wg.moveTo(mp.x,mp.y); wg.lineTo(wp.x,wp.y); wg.strokePath();
    wg.lineStyle(3,0x9aa0b5,1); wg.beginPath(); wg.moveTo(mp.x,mp.y); wg.lineTo(wp.x,wp.y); wg.strokePath(); }
  // колёса
  for(const w of [wheelB,wheelF]){
    wg.fillStyle(0x14141f,1); wg.fillCircle(w.position.x,w.position.y,R);
    wg.fillStyle(0x2b2f42,1); wg.fillCircle(w.position.x,w.position.y,R*0.62);
    wg.fillStyle(0xc9cee0,1); wg.fillCircle(w.position.x,w.position.y,R*0.22);
    wg.lineStyle(Math.max(3,R*0.10),0x6b7189,1);
    for(let k=0;k<6;k++){ const a=w.angle+k*Math.PI/3; wg.beginPath(); wg.moveTo(w.position.x,w.position.y); wg.lineTo(w.position.x+Math.cos(a)*R*0.55, w.position.y+Math.sin(a)*R*0.55); wg.strokePath(); }
  }
  // корпус (локальные координаты + поворот)
  bodyGfx.clear(); bodyGfx.setPosition(chassis.position.x,chassis.position.y); bodyGfx.setRotation(chassis.angle);
  drawBody(bodyGfx);
}

function drawBody(g){
  const c=CAR.color, dark=0x141420, bw=CAR.bw, bh=CAR.bh;
  const cw=CAR.cab.w, ch=CAR.cab.h, cx=CAR.cab.x;
  // арки колёс
  g.fillStyle(0x101018,1); g.fillCircle(-46,20,CAR.wheel+6); g.fillCircle(46,20,CAR.wheel+6);
  // нижний корпус
  g.fillStyle(c,1); g.lineStyle(3,dark,1);
  g.fillRoundedRect(-bw/2,-6,bw,bh,8); g.strokeRoundedRect(-bw/2,-6,bw,bh,8);
  // капот-скос спереди
  g.fillStyle(c,1); g.beginPath(); g.moveTo(bw/2-4,-6); g.lineTo(bw/2+14,2); g.lineTo(bw/2+14,bh-6); g.lineTo(bw/2-4,bh-6); g.closePath(); g.fillPath();
  // кабина
  g.fillStyle(CAR.roof,1); g.lineStyle(3,dark,1);
  g.beginPath(); g.moveTo(cx-cw/2,-6); g.lineTo(cx-cw/2+8,-6-ch); g.lineTo(cx+cw/2-14,-6-ch); g.lineTo(cx+cw/2,-6); g.closePath(); g.fillPath(); g.strokePath();
  // лобовое стекло
  g.fillStyle(CAR.glass,0.92); g.beginPath(); g.moveTo(cx+cw/2-16,-8); g.lineTo(cx+cw/2-6,-8); g.lineTo(cx+2,-6-ch+4); g.lineTo(cx-2,-6-ch+4); g.closePath(); g.fillPath();
  // водитель: голова + шлем
  g.fillStyle(0xf1c27d,1); g.fillCircle(cx-4,-6-ch+10,6);
  g.fillStyle(0xd63031,1); g.slice(cx-4,-6-ch+10,8,Math.PI,Math.PI*2,false); g.fillPath();
  // фара и задний габарит
  g.fillStyle(0xfff3b0,1); g.fillCircle(bw/2+8,8,4);
  g.fillStyle(0xff5252,1); g.fillCircle(-bw/2-1,8,3);
}

function startCountdown(){
  const el=document.getElementById('count'), n=document.getElementById('countnum');
  el.classList.remove('hidden'); let c=3; n.textContent=c;
  const t=setInterval(()=>{ c--; if(c>0){ n.textContent=c; } else if(c===0){ n.textContent='GO!'; } else { clearInterval(t); el.classList.add('hidden'); running=true; } },700);
}

function die(title,text){
  if(dead) return; dead=true; running=false; gasBtn=brakeBtn=false;
  setBest(maxAlt);
  document.getElementById('overTitle').textContent=title;
  document.getElementById('overText').textContent=(text||'')+' Высота: '+maxAlt+' м · Монеты: '+coins;
  document.getElementById('over').classList.remove('hidden');
}

/* ---------- ПРЕВЬЮ МАШИНЫ В МЕНЮ (canvas 2D) ---------- */
function drawCarPreview(){
  const cv=document.getElementById('carCanvas'), ctx=cv.getContext('2d'); const c=CARS[SEL.car];
  ctx.clearRect(0,0,150,84);
  const hex=n=>'#'+n.toString(16).padStart(6,'0');
  const bw=c.bw*0.62, bh=c.bh*0.62, cw=c.cab.w*0.62, ch=c.cab.h*0.62, cx=75+c.cab.x*0.62, R=c.wheel*0.62, by=48;
  ctx.fillStyle='rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(75,by+R+6,bw*0.7,6,0,0,7); ctx.fill();
  // колёса
  for(const wx of [75-28,75+28]){ ctx.fillStyle='#14141f'; ctx.beginPath(); ctx.arc(wx,by+R,R,0,7); ctx.fill(); ctx.fillStyle='#c9cee0'; ctx.beginPath(); ctx.arc(wx,by+R,R*0.3,0,7); ctx.fill(); }
  ctx.fillStyle=hex(c.color); ctx.strokeStyle='#141420'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.roundRect(75-bw/2,by-6,bw,bh,6); ctx.fill(); ctx.stroke();
  ctx.fillStyle=hex(c.roof); ctx.beginPath(); ctx.moveTo(cx-cw/2,by-6); ctx.lineTo(cx-cw/2+6,by-6-ch); ctx.lineTo(cx+cw/2-10,by-6-ch); ctx.lineTo(cx+cw/2,by-6); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle=hex(c.glass); ctx.beginPath(); ctx.moveTo(cx+cw/2-10,by-8); ctx.lineTo(cx+cw/2-4,by-8); ctx.lineTo(cx+1,by-6-ch+3); ctx.lineTo(cx-1,by-6-ch+3); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#f1c27d'; ctx.beginPath(); ctx.arc(cx-3,by-6-ch+7,4,0,7); ctx.fill();
  ctx.fillStyle='#d63031'; ctx.beginPath(); ctx.arc(cx-3,by-6-ch+7,5,Math.PI,0); ctx.fill();
}

/* ---------- МЕНЮ ---------- */
function renderStats(){
  const c=CARS[SEL.car];
  document.getElementById('carName').textContent=c.name;
  const box=document.getElementById('stats'); box.innerHTML='';
  for(const k in c.stats){ const v=c.stats[k];
    const row=document.createElement('div'); row.className='stat';
    row.innerHTML='<span class="lbl">'+k+'</span><span class="bar"><i style="width:'+(v*20)+'%"></i></span>';
    box.appendChild(row); }
  drawCarPreview();
}
function renderBiomes(){
  const box=document.getElementById('biomes'); box.innerHTML='';
  BIOMES.forEach((b,i)=>{ const chip=document.createElement('div'); chip.className='chip'+(i===SEL.biome?' sel':'');
    chip.innerHTML='<span class="dot" style="background:'+b.dot+'"></span>'+b.name+'<span class="wx">'+b.wxName+'</span>';
    chip.onclick=()=>{ SEL.biome=i; renderBiomes(); applyBiomeBg(BIOMES[i]); };
    box.appendChild(chip); });
}
function openMenu(){
  document.body.classList.remove('playing');
  document.getElementById('over').classList.add('hidden');
  document.getElementById('pause').classList.add('hidden');
  document.getElementById('menu').classList.remove('hidden');
  document.getElementById('best').textContent='Рекорд: '+getBest()+' м';
  renderStats(); renderBiomes(); applyBiomeBg(BIOMES[SEL.biome]);
}
function startGame(){
  document.getElementById('menu').classList.add('hidden');
  document.body.classList.add('playing');
  applyBiomeBg(BIOMES[SEL.biome]);
  game.scene.start('Game');
}
document.getElementById('prevCar').onclick=()=>{ SEL.car=(SEL.car+CARS.length-1)%CARS.length; renderStats(); };
document.getElementById('nextCar').onclick=()=>{ SEL.car=(SEL.car+1)%CARS.length; renderStats(); };
document.getElementById('playBtn').onclick=startGame;
document.getElementById('retryBtn').onclick=()=>{ document.getElementById('over').classList.add('hidden'); document.body.classList.add('playing'); game.scene.start('Game'); };
document.getElementById('menuBtn').onclick=()=>{ game.scene.stop('Game'); openMenu(); };

/* пауза */
function pauseGame(){ if(dead||paused||!document.body.classList.contains('playing')) return; paused=true; game.scene.pause('Game'); document.getElementById('pause').classList.remove('hidden'); }
function resumeGame(){ if(!paused) return; paused=false; document.getElementById('pause').classList.add('hidden'); game.scene.resume('Game'); }
document.getElementById('pauseBtn').onclick=pauseGame;
document.getElementById('resumeBtn').onclick=resumeGame;
document.getElementById('pMenuBtn').onclick=()=>{ paused=false; game.scene.stop('Game'); openMenu(); };

/* педали */
function bindPedal(id,setter){ const el=document.getElementById(id);
  const on=e=>{e.preventDefault();setter(true);}, off=e=>{e.preventDefault();setter(false);};
  el.addEventListener('touchstart',on,{passive:false}); el.addEventListener('touchend',off);
  el.addEventListener('mousedown',on); el.addEventListener('mouseup',off); el.addEventListener('mouseleave',off);
}
bindPedal('gas', v=>gasBtn=v); bindPedal('brake', v=>brakeBtn=v);

/* boot → menu */
let bp=0; const bt=setInterval(()=>{ bp=Math.min(100,bp+Phaser.Math.Between(8,22)); document.getElementById('bootfill').style.width=bp+'%';
  if(bp>=100){ clearInterval(bt); setTimeout(()=>{ document.getElementById('boot').classList.add('hidden'); openMenu(); },250); } },160);

/* Telegram Mini App */
const tg=window.Telegram&&window.Telegram.WebApp;
if(tg){ tg.ready(); tg.expand(); tg.setHeaderColor&&tg.setHeaderColor('#0b1026'); tg.disableVerticalSwipes&&tg.disableVerticalSwipes(); }
</script>

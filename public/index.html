<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Dmitry_Lixxx на бездорожье</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sunset-1:#2b1055;
    --sunset-2:#7b2d6e;
    --sunset-3:#ff7b54;
    --sunset-4:#ffd56b;
    --accent-gas:#ff6b4a;
    --accent-gas-dark:#e04e2f;
    --accent-brake:#3fa7ff;
    --accent-brake-dark:#2782d1;
    --amber:#ffb703;
    --gold:#ffd166;
    --panel:#241435;
    --panel-2:#33194a;
    --ink:#fff6ea;
    --ink-dim:#c9b8de;
    --danger:#ff4d5e;
    --good:#5be37b;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
    --safe-left:env(safe-area-inset-left,0px);
    --safe-right:env(safe-area-inset-right,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;width:100%;height:100%;overflow:hidden;
    background:#150a24;
    font-family:'Inter',sans-serif;
    color:var(--ink);
    touch-action:none;
    overscroll-behavior:none;
    user-select:none;
  }
  #app{position:fixed;inset:0;overflow:hidden;}
  canvas#game{position:absolute;inset:0;display:block;width:100%;height:100%;}

  .fredoka{font-family:'Fredoka',sans-serif;}

  /* ---------- HUD ---------- */
  #hud{
    position:absolute; inset:0; pointer-events:none;
    padding-top:calc(var(--safe-top) + 10px);
    padding-left:calc(var(--safe-left) + 12px);
    padding-right:calc(var(--safe-right) + 12px);
    opacity:0; transition:opacity .25s ease;
  }
  #hud.show{opacity:1;}
  .hud-row{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}

  .fuel-wrap{
    display:flex; align-items:center; gap:8px;
    background:rgba(20,10,35,.55); backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.12);
    border-radius:16px; padding:8px 12px; min-width:150px;
  }
  .fuel-icon{width:20px;height:22px;flex:none;}
  .fuel-bar-bg{flex:1; height:12px; border-radius:8px; background:rgba(255,255,255,.12); overflow:hidden; position:relative;}
  .fuel-bar-fill{height:100%; width:100%; border-radius:8px; background:linear-gradient(90deg,#5be37b,#a8e05f); transition:width .12s linear, background .3s;}
  .fuel-wrap.low .fuel-bar-fill{animation:pulseRed 0.7s infinite;}
  @keyframes pulseRed{0%,100%{opacity:1;}50%{opacity:.45;}}

  .coin-wrap{
    display:flex; align-items:center; gap:6px;
    background:rgba(20,10,35,.55); backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.12);
    border-radius:16px; padding:8px 14px;
    font-weight:700; font-size:16px;
  }
  .coin-dot{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%, #fff5c2, var(--gold) 55%, #b8860b 100%); box-shadow:0 0 6px rgba(255,209,102,.7); flex:none;}

  #distanceWrap{
    position:absolute; left:50%; top:calc(var(--safe-top) + 8px); transform:translateX(-50%);
    text-align:center; pointer-events:none;
  }
  #distanceNum{font-size:32px; font-weight:700; letter-spacing:.5px; text-shadow:0 2px 10px rgba(0,0,0,.6); line-height:1;}
  #distanceNum small{font-size:18px; opacity:.7; margin-left:2px;}
  #distanceLabel{font-size:10px; letter-spacing:4px; color:var(--ink-dim); text-transform:uppercase; margin-top:-2px;}

  #speedWrap{
    position:absolute; right:calc(var(--safe-right) + 14px); top:calc(var(--safe-top) + 72px);
    width:74px; height:74px; pointer-events:none;
    display:flex; align-items:center; justify-content:center;
  }
  #speedo{width:74px; height:74px; filter:drop-shadow(0 4px 10px rgba(0,0,0,.4));}
  #speedReadout{
    position:absolute; bottom:-2px; left:50%; transform:translateX(-50%);
    font-family:'Fredoka',sans-serif; font-weight:700;
    color:var(--ink); font-size:14px; line-height:1; text-align:center;
    text-shadow:0 1px 4px rgba(0,0,0,.7);
  }
  #speedReadout small{display:block; font-size:8px; font-weight:500; letter-spacing:1px; color:var(--ink-dim); margin-top:1px;}

  #pauseBtn{
    pointer-events:auto;
    width:40px;height:40px;border-radius:50%;
    background:rgba(20,10,35,.55); border:1px solid rgba(255,255,255,.15);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    margin-top:2px;
  }
  #pauseBtn svg{width:16px;height:16px;fill:var(--ink);}

  /* ---------- Controls ---------- */
  #controls{
    position:absolute; left:0; right:0; bottom:0;
    display:flex; justify-content:space-between; align-items:flex-end;
    padding:0 calc(var(--safe-left) + 18px) calc(var(--safe-bottom) + 22px) calc(var(--safe-right) + 18px);
    pointer-events:none; opacity:0; transition:opacity .25s ease;
  }
  #controls.show{opacity:1;}
  .ctrl-btn{
    pointer-events:auto;
    width:84px;height:84px;border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    border:3px solid rgba(255,255,255,.25);
    box-shadow:0 6px 18px rgba(0,0,0,.35), inset 0 2px 6px rgba(255,255,255,.25);
    transition:transform .08s ease, filter .08s ease;
    position:relative;
  }
  .ctrl-btn svg{width:34px;height:34px;fill:#fff; filter:drop-shadow(0 1px 2px rgba(0,0,0,.4));}
  .ctrl-btn.active{transform:scale(.9); filter:brightness(1.25);}
  #brakeBtn{background:radial-gradient(circle at 35% 30%, #6cc3ff, var(--accent-brake) 60%, var(--accent-brake-dark) 100%);}
  #gasBtn{background:radial-gradient(circle at 35% 30%, #ff9d7a, var(--accent-gas) 60%, var(--accent-gas-dark) 100%);}
  .ctrl-label{position:absolute; bottom:-20px; left:0; right:0; text-align:center; font-size:11px; letter-spacing:2px; color:var(--ink-dim); font-weight:600;}

  /* ---------- Screens ---------- */
  .screen{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column;
    background:radial-gradient(ellipse at 50% 20%, rgba(123,45,110,.55), rgba(21,10,36,.92) 65%);
    backdrop-filter:blur(3px);
    text-align:center; padding:24px;
    z-index:20;
  }
  .screen.hidden{display:none;}
  .title-main{
    font-size:clamp(38px,10vw,58px); font-weight:700; line-height:1;
    background:linear-gradient(180deg,#fff6ea, #ffd56b 55%, #ff7b54);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 6px 24px rgba(255,123,84,.25);
    letter-spacing:1px;
  }
  .title-sub{font-size:13px; letter-spacing:5px; color:var(--ink-dim); margin-top:6px; text-transform:uppercase;}
  #carPreview{
    width:240px; height:130px; margin-top:18px;
    filter:drop-shadow(0 8px 20px rgba(0,0,0,.5));
    animation:carBob 3s ease-in-out infinite;
  }
  @keyframes carBob{0%,100%{transform:translateY(0) rotate(-1deg);}50%{transform:translateY(-4px) rotate(1deg);}}
  .best-stat{margin-top:18px; font-size:14px; color:var(--ink-dim);}
  .best-stat b{color:var(--gold); font-weight:700;}
  .big-btn{
    margin-top:26px; border:none; cursor:pointer;
    font-family:'Fredoka',sans-serif; font-weight:600; font-size:22px; letter-spacing:1px;
    color:#2b1055; padding:16px 52px; border-radius:50px;
    background:linear-gradient(180deg,#ffe89a,var(--gold));
    box-shadow:0 8px 0 #b8860b, 0 14px 26px rgba(0,0,0,.4);
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .big-btn:active{transform:translateY(6px); box-shadow:0 2px 0 #b8860b, 0 6px 14px rgba(0,0,0,.35);}
  .ghost-btn{
    margin-top:14px; border:1px solid rgba(255,255,255,.25); cursor:pointer;
    font-family:'Fredoka',sans-serif; font-weight:600; font-size:16px; letter-spacing:.5px;
    color:var(--ink); padding:10px 30px; border-radius:40px;
    background:rgba(255,255,255,.06);
  }
  .howto{
    margin-top:22px; display:flex; gap:22px; align-items:center; color:var(--ink-dim); font-size:12px;
  }
  .howto .k{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .keyicon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,.25);}
  .keyicon svg{width:16px;height:16px;fill:#fff;}
  #muteBtn{
    position:absolute; top:calc(var(--safe-top) + 16px); right:calc(var(--safe-right) + 16px);
    width:38px;height:38px;border-radius:50%; border:1px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.06); display:flex;align-items:center;justify-content:center; cursor:pointer;
  }
  #muteBtn svg{width:16px;height:16px;fill:#fff;}

  .stat-row{display:flex; gap:26px; margin-top:22px;}
  .stat-box{background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); border-radius:14px; padding:12px 22px; min-width:96px;}
  .stat-box .v{font-size:24px; font-weight:700; font-family:'Fredoka',sans-serif; color:var(--gold);}
  .stat-box .l{font-size:11px; letter-spacing:2px; color:var(--ink-dim); text-transform:uppercase; margin-top:2px;}
  .new-best{
    margin-top:16px; font-size:13px; font-weight:700; letter-spacing:2px; color:#2b1055;
    background:linear-gradient(90deg,#ffe89a,var(--gold)); padding:6px 18px; border-radius:20px;
    animation:bestPop .5s ease;
  }
  @keyframes bestPop{0%{transform:scale(0);}70%{transform:scale(1.15);}100%{transform:scale(1);}}

  #loadingScreen{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:#150a24;}
  .loader{width:44px;height:44px;border-radius:50%;border:4px solid rgba(255,255,255,.15);border-top-color:var(--gold);animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="hud-row">
      <div class="fuel-wrap" id="fuelWrap">
        <svg class="fuel-icon" viewBox="0 0 24 26"><path d="M5 8h10v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V8z" fill="#ffb703" stroke="#3a2000" stroke-width="1.4"/><path d="M8 8V4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4" fill="none" stroke="#3a2000" stroke-width="1.4"/><rect x="6.5" y="11" width="7" height="3.5" rx="1" fill="#3a2000"/><path d="M15 10l3 3v6a1.5 1.5 0 0 1-3 0" fill="none" stroke="#3a2000" stroke-width="1.4"/></svg>
        <div class="fuel-bar-bg"><div class="fuel-bar-fill" id="fuelFill"></div></div>
      </div>
      <div class="coin-wrap"><div class="coin-dot"></div><span id="coinCount">0</span></div>
    </div>
  </div>

  <div id="distanceWrap">
    <div id="distanceNum" class="fredoka"><span>0</span> <small>m</small></div>
    <div id="distanceLabel">дистанция</div>
  </div>

  <div id="speedWrap">
    <svg viewBox="0 0 60 60" id="speedo">
      <circle cx="30" cy="30" r="26" fill="rgba(20,10,35,.65)" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
      <circle cx="30" cy="30" r="22" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="1.5"/>
      <g id="speedoTicks"></g>
      <line id="speedoNeedle" x1="30" y1="30" x2="30" y2="10" stroke="#ff6b4a" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="30" cy="30" r="3" fill="#ffd56b"/>
    </svg>
    <div id="speedReadout"><span id="speedNum">0</span><small>км/ч</small></div>
  </div>

  <div id="pauseBtn"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg></div>

  <div id="controls">
    <div id="brakeBtn" class="ctrl-btn"><svg viewBox="0 0 24 24"><path d="M15 4l-9 8 9 8V4z"/></svg><span class="ctrl-label">НАЗАД</span></div>
    <div id="gasBtn" class="ctrl-btn"><svg viewBox="0 0 24 24"><path d="M9 4l9 8-9 8V4z"/></svg><span class="ctrl-label">ГАЗ</span></div>
  </div>

  <!-- START SCREEN -->
  <div id="startScreen" class="screen">
    <button id="muteBtn"><svg viewBox="0 0 24 24" id="muteIcon"><path d="M4 9v6h4l5 5V4L8 9H4z"/></svg></button>
    <div class="title-main fredoka">DMITRY_LIXXX</div>
    <div class="title-sub">на бездорожье</div>
    <canvas id="carPreview" width="260" height="140"></canvas>
    <div class="best-stat">Лучший результат: <b id="bestDistanceStart">0 м</b> · <b id="bestCoinsStart">0</b> монет</div>
    <button id="playBtn" class="big-btn">ПОЕХАЛИ</button>
    <div class="howto">
      <div class="k"><div class="keyicon"><svg viewBox="0 0 24 24"><path d="M9 4l9 8-9 8V4z"/></svg></div>газ</div>
      <div class="k"><div class="keyicon"><svg viewBox="0 0 24 24"><path d="M15 4l-9 8 9 8V4z"/></svg></div>тормоз</div>
      <div class="k">Нива Ликса рвёт бездорожье</div>
    </div>
  </div>

  <!-- PAUSE SCREEN -->
  <div id="pauseScreen" class="screen hidden">
    <div class="title-main fredoka" style="font-size:38px;">ПАУЗА</div>
    <button id="resumeBtn" class="big-btn">ПРОДОЛЖИТЬ</button>
    <button id="restartFromPauseBtn" class="ghost-btn">Начать заново</button>
  </div>

  <!-- GAME OVER SCREEN -->
  <div id="gameOverScreen" class="screen hidden">
    <div class="title-main fredoka" id="gameOverTitle" style="font-size:42px;">РАЗБИЛСЯ!</div>
    <div id="newBestBadge" class="new-best" style="display:none;">🏆 НОВЫЙ РЕКОРД</div>
    <div class="stat-row">
      <div class="stat-box"><div class="v" id="finalDistance">0</div><div class="l">метров</div></div>
      <div class="stat-box"><div class="v" id="finalCoins">0</div><div class="l">монет</div></div>
      <div class="stat-box"><div class="v" id="finalBest">0</div><div class="l">рекорд</div></div>
    </div>
    <button id="retryBtn" class="big-btn">ЕЩЁ РАЗ</button>
    <button id="menuBtn" class="ghost-btn">В меню</button>
  </div>

  <div id="loadingScreen"><div class="loader"></div></div>
</div>

<script>
(function(){
"use strict";

/* ============================================================
   TELEGRAM MINI APP INTEGRATION
   ============================================================ */
var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) {
  try {
    tg.ready();
    tg.expand();
    if (tg.setHeaderColor) tg.setHeaderColor('#150a24');
    if (tg.setBackgroundColor) tg.setBackgroundColor('#150a24');
    if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
    if (tg.isVersionAtLeast && tg.isVersionAtLeast('7.7') && tg.requestFullscreen) {
      try { tg.requestFullscreen(); } catch(e){}
    }
    tg.onEvent && tg.onEvent('viewportChanged', function(){ resizeCanvas(); });
  } catch(e){}
}
function haptic(kind){
  if (!tg || !tg.HapticFeedback) return;
  try{
    if (kind==='light') tg.HapticFeedback.impactOccurred('light');
    else if (kind==='medium') tg.HapticFeedback.impactOccurred('medium');
    else if (kind==='heavy') tg.HapticFeedback.impactOccurred('heavy');
    else if (kind==='success') tg.HapticFeedback.notificationOccurred('success');
    else if (kind==='error') tg.HapticFeedback.notificationOccurred('error');
  }catch(e){}
}

/* ============================================================
   CANVAS SETUP
   ============================================================ */
var canvas = document.getElementById('game');
var ctx = canvas.getContext('2d', {alpha:false});
var W=0, H=0, DPR=1;

function resizeCanvas(){
  DPR = Math.min(window.devicePixelRatio||1, 2.5);
  var vw = (window.visualViewport ? window.visualViewport.width : window.innerWidth);
  var vh = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
  W = vw; H = vh;
  canvas.width = Math.round(W*DPR);
  canvas.height = Math.round(H*DPR);
  canvas.style.width = W+'px';
  canvas.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', resizeCanvas);
if (window.visualViewport) window.visualViewport.addEventListener('resize', resizeCanvas);
resizeCanvas();

if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){
    if (typeof r === 'number') r = {tl:r,tr:r,br:r,bl:r};
    this.beginPath();
    this.moveTo(x+r.tl,y);
    this.lineTo(x+w-r.tr,y);
    this.arcTo(x+w,y,x+w,y+r.tr,r.tr);
    this.lineTo(x+w,y+h-r.br);
    this.arcTo(x+w,y+h,x+w-r.br,y+h,r.br);
    this.lineTo(x+r.bl,y+h);
    this.arcTo(x,y+h,x,y+h-r.bl,r.bl);
    this.lineTo(x,y+r.tl);
    this.arcTo(x,y,x+r.tl,y,r.tl);
    this.closePath();
    return this;
  };
}

/* ============================================================
   UTILS
   ============================================================ */
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function hash01(n){ var s=Math.sin(n*127.1+311.7)*43758.5453123; return s-Math.floor(s); }
function noise1(x){
  var i=Math.floor(x), f=x-i;
  var a=hash01(i), b=hash01(i+1);
  var t=f*f*(3-2*f);
  return a+(b-a)*t;
}
function rotate(px,py,ang){
  var c=Math.cos(ang), s=Math.sin(ang);
  return {x: px*c - py*s, y: px*s + py*c};
}

/* ============================================================
   TERRAIN — deterministic, stateless, slope-bounded
   (guarantees the track is always driveable: no cliffs, no
   impossible walls, difficulty ramps up gently and is capped)
   ============================================================ */
var GROUND_BASE = 520;
var AMP1=85, FREQ1=0.00035;
var AMP2=26, FREQ2=0.0016;
var AMP3=10, FREQ3=0.006;
var AMP4=4,  FREQ4=0.03;
var maxDistancePx = 0;

function difficultyScale(){
  return 1 + Math.min(1, maxDistancePx/32000); // 1x -> 2x over distance, capped
}
function regionScale(x){
  return 0.7 + 0.5*noise1(x*0.00008); // 0.7 .. 1.2 slow variation (calm vs rough zones)
}
function terrainHeightAt(x){
  var diff = difficultyScale();
  var region = regionScale(x);
  var h = 0;
  h += (noise1(x*FREQ1)-0.5)*2*AMP1*region;
  h += (noise1(x*FREQ2)-0.5)*2*AMP2*region*Math.min(diff,1.5);
  h += (noise1(x*FREQ3)-0.5)*2*AMP3*Math.min(diff,1.6);
  h += (noise1(x*FREQ4)-0.5)*2*AMP4;
  return GROUND_BASE + h;
}
function terrainSlopeAt(x){
  var d = 2.5;
  return (terrainHeightAt(x+d)-terrainHeightAt(x-d))/(2*d);
}

/* ---- decorations (purely visual, deterministic per slot) ---- */
var DECOR_SPACING = 200;
function getDecorAt(slot){
  var r = hash01(slot*2.13+50.7);
  if (r > 0.58) return null;
  var x = slot*DECOR_SPACING + (hash01(slot*9.3+1)-0.5)*100;
  // wider variety: cactus / rock / bush / pine / dead tree
  var kind;
  if (r < 0.16) kind = 'cactus';
  else if (r < 0.32) kind = 'rock';
  else if (r < 0.46) kind = 'bush';
  else if (r < 0.54) kind = 'pine';
  else kind = 'deadtree';
  var scale = 0.75 + hash01(slot*4.4)*0.7;
  return {x:x, kind:kind, scale:scale, flip: hash01(slot*7.7)>0.5};
}

/* ---- collectibles (coins / fuel) ---- */
var COIN_SPACING = 72;
var collected = {};
function getSlotItem(slot){
  var r = hash01(slot*3.171+9.13);
  var x = slot*COIN_SPACING + 36 + (hash01(slot*5.91+1.7)-0.5)*18;
  if (r < 0.30) return {type:'coin', x:x, slot:slot};
  if (r < 0.38) return {type:'fuel', x:x, slot:slot};
  return null;
}

/* ============================================================
   PARTICLES
   ============================================================ */
var particles = [];
function spawnDust(x,y,dir){
  for (var i=0;i<4;i++){
    particles.push({
      x:x, y:y,
      vx:(Math.random()-0.5)*50 - dir*80, vy:-Math.random()*90-25,
      life:0, maxLife:0.45+Math.random()*0.35, r:2.5+Math.random()*3.5, kind:'dust'
    });
  }
}
function spawnSmoke(x,y){
  particles.push({
    x:x,y:y, vx:-32-Math.random()*22, vy:-46-Math.random()*22,
    life:0, maxLife:0.7+Math.random()*0.35, r:3.5+Math.random()*3, kind:'smoke'
  });
}
function spawnSparkle(x,y,color){
  for (var i=0;i<6;i++){
    var a = Math.random()*Math.PI*2;
    var sp = 30+Math.random()*80;
    particles.push({
      x:x,y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 40,
      life:0, maxLife:0.5+Math.random()*0.3, r:1.5+Math.random()*2, kind:'sparkle', color:color
    });
  }
}
function spawnCrash(x,y){
  // explosion of sparks + smoke
  for (var i=0;i<22;i++){
    var a = Math.random()*Math.PI*2;
    var sp = 80+Math.random()*240;
    particles.push({
      x:x,y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-100,
      life:0, maxLife:0.5+Math.random()*0.5, r:2+Math.random()*4, kind:'spark'
    });
  }
  for (var i=0;i<8;i++){
    particles.push({
      x:x,y:y, vx:(Math.random()-0.5)*60, vy:-50-Math.random()*70,
      life:0, maxLife:0.9+Math.random()*0.5, r:6+Math.random()*5, kind:'smoke'
    });
  }
}
function updateParticles(dt){
  for (var i=particles.length-1;i>=0;i--){
    var p = particles[i];
    p.life += dt;
    if (p.life>=p.maxLife){ particles.splice(i,1); continue; }
    p.vy += (p.kind==='smoke'? -10 : 260)*dt;
    p.vx *= 0.985;
    p.x += p.vx*dt;
    p.y += p.vy*dt;
  }
}

/* ---- floating pop texts ("+1", "+FUEL") ---- */
var popTexts = [];
function spawnPop(x,y,text,color){
  popTexts.push({x:x,y:y,text:text,color:color,life:0});
}
function updatePops(dt){
  for (var i=popTexts.length-1;i>=0;i--){
    var p = popTexts[i];
    p.life += dt;
    p.y -= 40*dt;
    if (p.life>0.9) popTexts.splice(i,1);
  }
}

/* ============================================================
   CAR — chassis is the only rigid body; wheels are 1-DOF
   spring-damper struts whose ground-contact length is solved
   analytically each frame against the terrain heightfield.
   ============================================================ */
// CAR_SCALE: scales every visual & physical dimension of the car. Lower = smaller car.
// Tuned for a release-quality feel: noticeable presence on screen without dominating it.
var CAR_SCALE = 0.78;

var GRAVITY = 1900;
var MASS = 1;
// Smaller car => smaller moment of inertia (scales with size^2).
var INERTIA = 1100 * CAR_SCALE * CAR_SCALE; // ~670

var BODY_W = Math.round(128 * CAR_SCALE), BODY_H = Math.round(44 * CAR_SCALE); // 100 x 34
// Lada Niva-style boxy silhouette. Drawn unscaled; physics collision uses bodyCornersPhys.
var bodyCorners = [
  {x:-64,y:-18},{x:-54,y:-38},{x:38,y:-40},{x:58,y:-26},{x:62,y:4},{x:48,y:14},{x:-54,y:12},{x:-66,y:-2}
];
// Scaled copy used for crash-detection physics (must match the visual scale).
var bodyCornersPhys = bodyCorners.map(function(c){ return {x:c.x*CAR_SCALE, y:c.y*CAR_SCALE}; });

var WHEEL_R = 15;                       // smaller wheels (was 22 — user said "absolutely huge")
var REST_LEN = Math.round(32*CAR_SCALE), MIN_LEN = 5, MAX_LEN = Math.round(52*CAR_SCALE); // 25, 5, 40
// Overdamped suspension — kills the max-speed vibration/rattle completely.
// Damping ratio = SUS_D / (2*sqrt(SUS_K)) ≈ 80/(2*36) ≈ 1.1 (slightly overdamped)
var SUS_K = 1300, SUS_D = 80;
// Chassis pitch spring — also near-critically damped so the body can't oscillate.
var CHASSIS_K = 95, CHASSIS_D = 22;

var ENGINE_POWER = 1700;
var BRAKE_POWER = 2500;
var REVERSE_MUL = 0.55;
var AIR_TILT = 4.2;
var FUEL_RATE = 100/42; // full tank ~42s of full throttle

// Wheelie control — keeps the car from flipping backward when the player pins the gas.
var WHEELIE_SOFT_START = -0.12;   // rad (~-7°) — start tapering engine power
var WHEELIE_HARD_LIMIT = -0.32;   // rad (~-18°) — apply strong counter-torque past this
var WHEELIE_COUNTER_TORQUE = Math.round(9500 * CAR_SCALE * CAR_SCALE); // ~5800

var car = null;
function makeWheel(localX, localY){
  return {localX:localX, localY:localY, susLen:REST_LEN, susVel:0, x:0, y:0, spin:0, grounded:false};
}
function resetCar(){
  var startX = 260;
  var gy = terrainHeightAt(startX);
  car = {
    x:startX, y:gy-80, angle:0, vx:0, vy:0, angularVel:0,
    fuel:100, coins:0, crashed:false, crashReason:null,
    stuckTimer:0, airTime:0, wheels:[ makeWheel(-44*CAR_SCALE, 18*CAR_SCALE), makeWheel(46*CAR_SCALE, 14*CAR_SCALE) ], // [rear, front]
    maxX:startX
  };
}
resetCar();

// Debug hook — exposes minimal state on window for testing / debugging
window.__getGameState = function(){
  if (!car) return null;
  return {
    x: car.x, maxX: car.maxX, crashed: car.crashed, crashReason: car.crashReason,
    fuel: car.fuel, coins: car.coins, angle: car.angle, vx: car.vx, vy: car.vy,
    state: state, maxDistancePx: maxDistancePx
  };
};
// Debug input setters (mirror what the on-screen pedals do)
window.__setGas = function(v){ input.gas = v; };
window.__setBrake = function(v){ input.brake = v; };

function addForceAt(acc, contact, F){
  acc.fx += F.x; acc.fy += F.y;
  var rx = contact.x - car.x, ry = contact.y - car.y;
  acc.torque += rx*F.y - ry*F.x;
}

function stepPhysics(dt, input){
  if (car.crashed) return;

  var acc = {fx:0, fy:0, torque:0};
  var anyGrounded = false;
  var drive = (car.fuel>0 ? input.gas : 0) - input.brake; // -1..1

  for (var i=0;i<car.wheels.length;i++){
    var w = car.wheels[i];
    var isRear = (i===0);
    var mount = rotate(w.localX, w.localY, car.angle);
    var mountWorld = {x:car.x+mount.x, y:car.y+mount.y};
    var springDir = rotate(0,1,car.angle); // local "down", rotated with chassis

    var desiredLen;
    if (springDir.y > 0.15){
      var xEst = mountWorld.x + springDir.x*REST_LEN;
      var gY = terrainHeightAt(xEst);
      var L = (gY - WHEEL_R - mountWorld.y)/springDir.y;
      var xEst2 = mountWorld.x + springDir.x*clamp(L,MIN_LEN,MAX_LEN);
      var gY2 = terrainHeightAt(xEst2);
      L = (gY2 - WHEEL_R - mountWorld.y)/springDir.y;
      desiredLen = clamp(L, MIN_LEN, MAX_LEN);
      w.grounded = L <= MAX_LEN + 1;
    } else {
      desiredLen = MAX_LEN;
      w.grounded = false;
    }
    if (w.grounded) anyGrounded = true;

    var err = desiredLen - w.susLen;
    w.susVel += (err*SUS_K - w.susVel*SUS_D)*dt;
    w.susLen += w.susVel*dt;
    w.susLen = clamp(w.susLen, MIN_LEN, MAX_LEN);

    w.x = mountWorld.x + springDir.x*w.susLen;
    w.y = mountWorld.y + springDir.y*w.susLen;

    var compression = REST_LEN - w.susLen;
    var pushMag = Math.max(0, compression*CHASSIS_K - w.susVel*CHASSIS_D);
    var F = {x:-springDir.x*pushMag, y:-springDir.y*pushMag};
    addForceAt(acc, mountWorld, F);

    // drive / brake force applied at wheel contact point
    if (w.grounded){
      var contact = {x:w.x, y:w.y+WHEEL_R};
      var slope = terrainSlopeAt(w.x);
      var tlen = Math.sqrt(1+slope*slope);
      var tangent = {x:1/tlen, y:slope/tlen};
      var bias = isRear ? 0.62 : 0.38;
      var speedAlong = car.vx*tangent.x + car.vy*tangent.y;

      if (drive > 0.01){
        // Wheelie control stage 1: taper engine force as the nose rises,
        // so pinning the gas on flat ground can't flip the car backward.
        var pitchFactor = 1.0;
        if (car.angle < WHEELIE_SOFT_START){
          pitchFactor = Math.max(0.25, 1 + (car.angle - WHEELIE_SOFT_START) * 1.6);
        }
        var f = ENGINE_POWER*drive*bias*pitchFactor;
        addForceAt(acc, contact, {x:tangent.x*f, y:tangent.y*f});
        w.spin += (speedAlong/WHEEL_R)*dt + drive*dt*6;
      } else if (drive < -0.01){
        if (Math.abs(speedAlong) > 26){
          var fb = BRAKE_POWER*(-drive)*bias*Math.sign(speedAlong);
          addForceAt(acc, contact, {x:-tangent.x*fb, y:-tangent.y*fb});
        } else {
          var fr = ENGINE_POWER*REVERSE_MUL*(-drive)*bias;
          addForceAt(acc, contact, {x:-tangent.x*fr, y:-tangent.y*fr});
        }
        w.spin += (speedAlong/WHEEL_R)*dt;
      } else {
        // light rolling resistance
        var rr = -speedAlong*0.6;
        addForceAt(acc, contact, {x:tangent.x*rr, y:tangent.y*rr});
        w.spin += (speedAlong/WHEEL_R)*dt;
      }

      if (Math.abs(speedAlong) > 55 && Math.random() < 0.9){
        spawnDust(contact.x, contact.y, tangent.x*Math.sign(speedAlong||1));
      }
    } else {
      w.spin += w.susVel*0.002;
    }
  }

  // mid-air tilt control
  if (!anyGrounded){
    car.angularVel += ((input.gas) - input.brake) * AIR_TILT * dt;
    car.airTime += dt;
  } else {
    car.airTime = 0;
    // Wheelie control stage 2: hard counter-torque past the hard limit.
    // This physically prevents the chassis from flipping past ~24° nose-up,
    // so even a pinned throttle on a steep uphill can't roll the car backward.
    if (car.angle < WHEELIE_HARD_LIMIT){
      var excess = WHEELIE_HARD_LIMIT - car.angle; // positive
      acc.torque += excess * WHEELIE_COUNTER_TORQUE;
    }
    // Symmetric nose-dive protection: stop the front from digging in on steep downhills
    if (car.angle > -WHEELIE_HARD_LIMIT * 0.8){
      var excessF = car.angle - (-WHEELIE_HARD_LIMIT * 0.8);
      acc.torque -= excessF * WHEELIE_COUNTER_TORQUE * 0.7;
    }
  }

  // fuel consumption
  if (input.gas > 0.01 && car.fuel > 0){
    car.fuel = Math.max(0, car.fuel - FUEL_RATE*input.gas*dt);
  }

  // aerodynamic drag (caps top speed so the car doesn't launch off every bump)
  // Tuned for ENGINE_POWER=1700: top speed ~ sqrt(1700/0.0035) ~ 696 px/s.
  var spd = Math.sqrt(car.vx*car.vx+car.vy*car.vy);
  if (spd > 1){
    var dragMag = 0.0035*spd*spd;
    acc.fx += -(car.vx/spd)*dragMag;
    acc.fy += -(car.vy/spd)*dragMag;
  }

  car.vx += (acc.fx/MASS)*dt;
  car.vy += (acc.fy/MASS + GRAVITY)*dt;
  car.x += car.vx*dt;
  car.y += car.vy*dt;

  car.angularVel += (acc.torque/INERTIA)*dt;
  car.angularVel *= 0.986;
  car.angularVel = clamp(car.angularVel, -7, 7);
  car.angle += car.angularVel*dt;

  // Hard wheelie bar: clamp pitch when grounded so the chassis physically
  // cannot flip past the safe zone. Lets the player pin the gas on uphills
  // without looping the car backward.
  if (anyGrounded){
    var noseUpLimit = WHEELIE_HARD_LIMIT;          // ~-24°
    var noseDownLimit = -WHEELIE_HARD_LIMIT * 0.7; // ~+17°
    if (car.angle < noseUpLimit){
      car.angle = noseUpLimit;
      if (car.angularVel < 0) car.angularVel = 0;
    } else if (car.angle > noseDownLimit){
      car.angle = noseDownLimit;
      if (car.angularVel > 0) car.angularVel = 0;
    }
  }

  if (car.x > car.maxX){ car.maxX = car.x; maxDistancePx = car.maxX; }

  // crash detection: body hull touching terrain
  // Use a generous sink tolerance (16px) — the suspension can absorb a lot,
  // and small body dips during hard landings shouldn't insta-crash the player.
  for (var c=0;c<bodyCornersPhys.length;c++){
    var p = rotate(bodyCornersPhys[c].x, bodyCornersPhys[c].y, car.angle);
    var wx = car.x+p.x, wy = car.y+p.y;
    var gy2 = terrainHeightAt(wx);
    if (wy > gy2 + 16){
      triggerCrash('body');
      break;
    }
  }
  if (car.y > terrainHeightAt(car.x) + 500){
    triggerCrash('body');
  }

  // stuck / out of fuel
  if (car.fuel <= 0 && anyGrounded && Math.abs(car.vx) < 14){
    car.stuckTimer += dt;
    if (car.stuckTimer > 2.2) triggerCrash('fuel');
  } else {
    car.stuckTimer = 0;
  }

  // collectibles
  var slotLo = Math.floor((car.x-140)/COIN_SPACING);
  var slotHi = Math.floor((car.x+140)/COIN_SPACING);
  for (var s=slotLo; s<=slotHi; s++){
    if (collected[s]) continue;
    var item = getSlotItem(s);
    if (!item) continue;
    var iy = terrainHeightAt(item.x) - 58;
    var dx = car.x-item.x, dy = car.y-iy;
    if (dx*dx+dy*dy < 46*46){
      collected[s] = true;
      if (item.type==='coin'){
        car.coins++;
        spawnPop(item.x, iy, '+1', '#ffd166');
        spawnSparkle(item.x, iy, '#ffd166');
        haptic('light');
      } else {
        car.fuel = Math.min(100, car.fuel + 34);
        spawnPop(item.x, iy, '+FUEL', '#5be37b');
        spawnSparkle(item.x, iy, '#5be37b');
        haptic('light');
      }
    }
  }
}

function triggerCrash(reason){
  if (car.crashed) return;
  car.crashed = true;
  car.crashReason = reason;
  if (reason==='body'){
    spawnCrash(car.x, car.y);
    haptic('heavy');
  } else {
    haptic('error');
  }
}

/* ============================================================
   CAMERA
   ============================================================ */
var camera = {x:0, y:0, shake:0};
function updateCamera(dt){
  // Smoothed look-ahead: clamp how fast lookAhead can change so a jittery vx
  // at top speed can't yank the camera horizontally.
  var targetLook = clamp(car.vx*0.18, -140, 220);
  if (!camera._look) camera._look = targetLook;
  camera._look = lerp(camera._look, targetLook, 1-Math.pow(0.05, dt));
  var targetX = car.x - W*0.38 + camera._look;
  // Smoothed Y target: average the chassis and wheel-averaged position so
  // suspension bounce doesn't translate into camera jitter.
  var wheelAvgY = (car.wheels[0].y + car.wheels[1].y)*0.5;
  var yAnchor = (car.y + wheelAvgY)*0.5;
  var targetY = yAnchor - H*0.56;
  // Critically-damped follow (slower on Y for vertical calm, faster on X for responsiveness).
  camera.x = lerp(camera.x, targetX, 1-Math.pow(0.001, dt));
  camera.y = lerp(camera.y, targetY, 1-Math.pow(0.004, dt));
  if (camera.shake>0){ camera.shake = Math.max(0, camera.shake - dt*3); }
}

/* ============================================================
   INPUT
   ============================================================ */
var input = {gas:0, brake:0};
var gasBtn = document.getElementById('gasBtn');
var brakeBtn = document.getElementById('brakeBtn');
function bindHold(el, setter){
  var active=false;
  function on(e){ if(e.cancelable) e.preventDefault(); active=true; setter(1); el.classList.add('active'); }
  function off(e){ if(!active) return; active=false; setter(0); el.classList.remove('active'); }
  el.addEventListener('pointerdown', on);
  el.addEventListener('pointerup', off);
  el.addEventListener('pointercancel', off);
  el.addEventListener('pointerleave', off);
  el.addEventListener('contextmenu', function(e){e.preventDefault();});
}
bindHold(gasBtn, function(v){ input.gas=v; });
bindHold(brakeBtn, function(v){ input.brake=v; });

window.addEventListener('keydown', function(e){
  if (['ArrowRight','KeyD','KeyW','ArrowUp'].indexOf(e.code)>=0){ input.gas=1; gasBtn.classList.add('active'); }
  if (['ArrowLeft','KeyA','KeyS','ArrowDown'].indexOf(e.code)>=0){ input.brake=1; brakeBtn.classList.add('active'); }
  if (e.code==='Escape') togglePause();
});
window.addEventListener('keyup', function(e){
  if (['ArrowRight','KeyD','KeyW','ArrowUp'].indexOf(e.code)>=0){ input.gas=0; gasBtn.classList.remove('active'); }
  if (['ArrowLeft','KeyA','KeyS','ArrowDown'].indexOf(e.code)>=0){ input.brake=0; brakeBtn.classList.remove('active'); }
});

/* ============================================================
   AUDIO — lightweight synthesized engine hum (no assets)
   ============================================================ */
var MUTE_KEY = 'dmitryLixxxMuted';
var audioCtx=null, engineOsc=null, engineGain=null, muted=false;
try { muted = JSON.parse(localStorage.getItem(MUTE_KEY)) === true; } catch(e) {}
function persistMute(){ try { localStorage.setItem(MUTE_KEY, JSON.stringify(muted)); } catch(e) {} }
function initAudio(){
  if (audioCtx || muted) return;
  try{
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    engineOsc = audioCtx.createOscillator();
    engineOsc.type = 'sawtooth';
    engineGain = audioCtx.createGain();
    engineGain.gain.value = 0;
    var filter = audioCtx.createBiquadFilter();
    filter.type='lowpass'; filter.frequency.value=800;
    engineOsc.connect(filter); filter.connect(engineGain); engineGain.connect(audioCtx.destination);
    engineOsc.frequency.value = 60;
    engineOsc.start();
  }catch(e){ audioCtx=null; }
}
function updateEngineAudio(){
  if (!audioCtx || muted) return;
  var spd = Math.min(1, Math.sqrt(car.vx*car.vx+car.vy*car.vy)/900);
  var target = car.crashed ? 0 : (0.03 + spd*0.05 + input.gas*0.05);
  engineGain.gain.setTargetAtTime(target, audioCtx.currentTime, 0.05);
  engineOsc.frequency.setTargetAtTime(55 + spd*260 + input.gas*70, audioCtx.currentTime, 0.08);
}
function updateMuteIcon(){
  document.getElementById('muteIcon').innerHTML = muted
    ? '<path d="M4 9v6h4l5 5V4L8 9H4z"/><line x1="16" y1="9" x2="21" y2="15" stroke="#fff" stroke-width="2"/><line x1="21" y1="9" x2="16" y2="15" stroke="#fff" stroke-width="2"/>'
    : '<path d="M4 9v6h4l5 5V4L8 9H4z"/>';
}
updateMuteIcon();
document.getElementById('muteBtn').addEventListener('click', function(){

/* ============================================================
   RENDERING
   ============================================================ */
function worldToScreen(x,y){ return {x:x-camera.x, y:y-camera.y}; }

function drawSky(){
  var g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, '#1b0f3d');
  g.addColorStop(0.42, '#5b2e6e');
  g.addColorStop(0.72, '#ff7b54');
  g.addColorStop(1, '#ffd56b');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);

  // ---- stars (twinkle, parallax very subtle) ----
  var starShift = -camera.x*0.02;
  for (var i=0;i<60;i++){
    var sx = ((i*173.7 + starShift) % (W+200) + (W+200)) % (W+200) - 100;
    var sy = (i*47.3) % (H*0.42);
    var tw = 0.4 + 0.6*Math.abs(Math.sin(clock*1.5 + i*0.7));
    ctx.globalAlpha = 0.55 * tw;
    ctx.fillStyle = i%7===0 ? '#ffe066' : '#fff6ea';
    ctx.beginPath(); ctx.arc(sx, sy, i%5===0 ? 1.6 : 0.9, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // ---- sun glow (large soft halo) ----
  var sunX = W*0.76 - camera.x*0.04, sunY = H*0.30;
  var halo = ctx.createRadialGradient(sunX,sunY,0,sunX,sunY,260);
  halo.addColorStop(0,'rgba(255,235,180,0.85)');
  halo.addColorStop(0.25,'rgba(255,180,120,0.45)');
  halo.addColorStop(0.6,'rgba(255,120,90,0.18)');
  halo.addColorStop(1,'rgba(255,120,90,0)');
  ctx.fillStyle = halo;
  ctx.fillRect(sunX-260,sunY-260,520,520);

  // ---- sun disc with corona ----
  var corona = ctx.createRadialGradient(sunX,sunY,30,sunX,sunY,80);
  corona.addColorStop(0,'rgba(255,250,220,0.7)');
  corona.addColorStop(1,'rgba(255,220,150,0)');
  ctx.fillStyle = corona;
  ctx.fillRect(sunX-80,sunY-80,160,160);
  ctx.beginPath(); ctx.fillStyle='#fff7d8'; ctx.arc(sunX,sunY,42,0,Math.PI*2); ctx.fill();
  // sun rim shadow for depth
  ctx.beginPath();
  ctx.strokeStyle = 'rgba(255,180,100,0.4)'; ctx.lineWidth = 2;
  ctx.arc(sunX,sunY,42,0,Math.PI*2); ctx.stroke();

  // ---- distant atmospheric haze at horizon ----
  var haze = ctx.createLinearGradient(0, H*0.55, 0, H*0.78);
  haze.addColorStop(0, 'rgba(255,140,90,0)');
  haze.addColorStop(1, 'rgba(255,180,110,0.35)');
  ctx.fillStyle = haze;
  ctx.fillRect(0, H*0.55, W, H*0.23);
}

function drawMountainLayer(baseY, amp, freq, factor, color, seed, snowCap){
  ctx.beginPath();
  ctx.moveTo(0, H);
  var step = 18;
  var peaks = [];
  for (var sx=0; sx<=W+step; sx+=step){
    var wx = sx + camera.x*factor;
    var y = baseY - (noise1(wx*freq+seed))*amp;
    ctx.lineTo(sx, y);
    peaks.push({x:sx, y:y});
  }
  ctx.lineTo(W,H); ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();

  // Snow caps: drawn as a smooth "snow line" that follows the ridge instead of
  // little hard white triangles (which read as stray artifacts from far away).
  // Only the closest mountain layer gets snow; back layers stay dark for depth.
  if (snowCap){
    var snowLine = baseY - amp*0.62; // only peaks higher than this get snow
    ctx.fillStyle = snowCap;
    ctx.beginPath();
    var started = false;
    for (var i=0;i<peaks.length;i++){
      var p = peaks[i];
      if (p.y < snowLine){
        if (!started){ ctx.moveTo(p.x, p.y + (snowLine - p.y)*0.6); started=true; }
        else ctx.lineTo(p.x, p.y);
      } else if (started){
        // close the snow patch at the snow line
        ctx.lineTo(p.x, snowLine);
        ctx.lineTo(peaks[i-1].x, snowLine);
        ctx.closePath(); ctx.fill();
        ctx.beginPath();
        started = false;
      }
    }
    if (started){ ctx.lineTo(peaks[peaks.length-1].x, snowLine); ctx.closePath(); ctx.fill(); }
  }
}

// Midground tree-line layer: a dark forested ridge between the mountains and the
// terrain. Adds depth and breaks up the visual jump from mountains to ground.
function drawMidgroundTrees(){
  var baseY = H*0.86;
  var factor = 0.62;
  var step = 14;
  // distant dark tree silhouettes
  ctx.fillStyle = 'rgba(28,16,38,0.85)';
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (var sx=0; sx<=W+step; sx+=step){
    var wx = sx + camera.x*factor;
    var ridge = baseY - (noise1(wx*0.0018+44.1))*48;
    // bumpy tree tops
    var bump = (Math.sin(wx*0.07)*4 + Math.sin(wx*0.13)*3);
    ctx.lineTo(sx, ridge + bump);
  }
  ctx.lineTo(W,H); ctx.closePath();
  ctx.fill();
}

/* ---- starting banner + milestone distance signs ---- */
var START_X = 260;
function drawTrackMarkers(){
  // Starting line gate — two poles with a checkered banner across the top.
  // Always rendered when the start line is in view.
  if (camera.x - 200 < START_X && camera.x + W + 200 > START_X){
    var gy = terrainHeightAt(START_X);
    var sp = worldToScreen(START_X, gy);
    var gateWidth = 120;
    var gateHeight = 130;
    ctx.save();
    ctx.translate(sp.x, sp.y);
    // left pole
    ctx.strokeStyle = '#1a1a14'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-gateWidth/2, 0); ctx.lineTo(-gateWidth/2, -gateHeight); ctx.stroke();
    // right pole
    ctx.beginPath(); ctx.moveTo(gateWidth/2, 0); ctx.lineTo(gateWidth/2, -gateHeight); ctx.stroke();
    // banner across the top (checkered)
    var bw = gateWidth, bh = 30, by = -gateHeight;
    var fs = 8;
    for (var row=0; row<bh/fs; row++){
      for (var col=0; col<bw/fs; col++){
        ctx.fillStyle = (row+col)%2===0 ? '#fff6ea' : '#15120a';
        ctx.fillRect(-bw/2 + col*fs, by + row*fs, fs, fs);
      }
    }
    ctx.strokeStyle = '#15120a'; ctx.lineWidth = 1.5;
    ctx.strokeRect(-bw/2, by, bw, bh);
    // "СТАРТ" sign on the ground (yellow plate)
    ctx.fillStyle = '#ffd166';
    ctx.beginPath(); ctx.roundRect(-32, -3, 64, 12, 2); ctx.fill();
    ctx.strokeStyle = '#3a2010'; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.fillStyle = '#15120a';
    ctx.font = "700 10px 'Fredoka',sans-serif"; ctx.textAlign = 'center';
    ctx.fillText('СТАРТ', 0, 6);
    ctx.restore();
  }

  // Distance markers every 100m — small wooden sign posts along the right side of the track.
  var markerSpacingM = 100;
  var startMeters = 100;
  var lastMarker = 10000;
  var firstMarkerWorldX = START_X + startMeters * PX_PER_METER;
  var markerSpacingPx = markerSpacingM * PX_PER_METER;
  var loIdx = Math.floor((camera.x - 100 - firstMarkerWorldX) / markerSpacingPx);
  var hiIdx = Math.floor((camera.x + W + 100 - firstMarkerWorldX) / markerSpacingPx);
  for (var i = Math.max(0, loIdx); i <= hiIdx; i++){
    var meters = startMeters + i * markerSpacingM;
    if (meters > lastMarker) break;
    var wx = firstMarkerWorldX + i * markerSpacingPx;
    var gy = terrainHeightAt(wx);
    var sp = worldToScreen(wx, gy);
    if (sp.x < -60 || sp.x > W + 60) continue;
    // alternate side of the track for variety
    var side = (i % 2 === 0) ? 1 : -1;
    var px = sp.x + side * 60;
    ctx.save();
    ctx.translate(px, sp.y);
    // post
    ctx.strokeStyle = '#5a3a22'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -46); ctx.stroke();
    // sign board (wooden)
    ctx.fillStyle = '#9a6a3a';
    ctx.beginPath(); ctx.roundRect(-26, -56, 52, 20, 3); ctx.fill();
    ctx.strokeStyle = '#3a2010'; ctx.lineWidth = 1.4; ctx.stroke();
    // wood grain
    ctx.strokeStyle = 'rgba(58,32,16,0.35)'; ctx.lineWidth = 0.6;
    ctx.beginPath(); ctx.moveTo(-22, -50); ctx.lineTo(22, -50); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-22, -44); ctx.lineTo(22, -44); ctx.stroke();
    // distance text
    ctx.fillStyle = '#fff6ea';
    ctx.font = "700 11px 'Fredoka',sans-serif"; ctx.textAlign = 'center';
    ctx.fillText(meters + ' м', 0, -42);
    ctx.restore();
  }
}

function drawClouds(){
  ctx.fillStyle = 'rgba(255,246,234,0.35)';
  for (var i=0;i<5;i++){
    var seed = i*913.7;
    var speed = 0.05 + (i%3)*0.01;
    var baseX = (i*380) - ((camera.x*speed) % 900);
    var x = ((baseX % (W+600)) + (W+600)) % (W+600) - 300;
    var y = 60 + i*44 + Math.sin(i*2)*20;
    ctx.beginPath();
    ctx.ellipse(x, y, 60, 20, 0, 0, Math.PI*2);
    ctx.ellipse(x+34, y+6, 40, 16, 0, 0, Math.PI*2);
    ctx.ellipse(x-34, y+8, 36, 14, 0, 0, Math.PI*2);
    ctx.fill();
  }
}

function drawDecorations(){
  var loSlot = Math.floor((camera.x-200)/DECOR_SPACING)-1;
  var hiSlot = Math.floor((camera.x+W+200)/DECOR_SPACING)+1;
  for (var s=loSlot; s<=hiSlot; s++){
    var d = getDecorAt(s);
    if (!d) continue;
    var gy = terrainHeightAt(d.x);
    var sp = worldToScreen(d.x, gy);
    if (sp.x < -100 || sp.x > W+100) continue;
    ctx.save();
    ctx.translate(sp.x, sp.y);
    ctx.scale(d.flip?-d.scale:d.scale, d.scale);
    if (d.kind==='cactus'){
      // Saguaro cactus with two arms
      ctx.fillStyle = '#3a7a44';
      ctx.beginPath(); ctx.roundRect(-6,-72,12,72,6); ctx.fill();
      ctx.beginPath(); ctx.roundRect(-22,-50,12,34,6); ctx.fill();
      ctx.beginPath(); ctx.roundRect(-22,-58,12,10,5); ctx.fill();
      ctx.beginPath(); ctx.roundRect(10,-60,12,34,6); ctx.fill();
      ctx.beginPath(); ctx.roundRect(10,-68,12,10,5); ctx.fill();
      // ridge lines
      ctx.strokeStyle = '#2a5a32'; ctx.lineWidth = 1;
      for (var ry=-66; ry<0; ry+=6){
        ctx.beginPath(); ctx.moveTo(-5,ry); ctx.lineTo(5,ry); ctx.stroke();
      }
    } else if (d.kind==='rock'){
      // Bigger rocky outcrop with highlights
      ctx.fillStyle = '#3a2540';
      ctx.beginPath();
      ctx.moveTo(-30,4); ctx.lineTo(-22,-20); ctx.lineTo(-2,-32); ctx.lineTo(20,-22); ctx.lineTo(28,-4); ctx.lineTo(20,8); ctx.closePath();
      ctx.fill();
      ctx.fillStyle = 'rgba(255,200,160,0.18)';
      ctx.beginPath();
      ctx.moveTo(-22,-20); ctx.lineTo(-2,-32); ctx.lineTo(8,-22); ctx.lineTo(-12,-12); ctx.closePath();
      ctx.fill();
      // small pebble next to it
      ctx.fillStyle = '#2a1a30';
      ctx.beginPath(); ctx.ellipse(-30,6,5,3,0,0,Math.PI*2); ctx.fill();
    } else if (d.kind==='bush'){
      // Round scrub bush
      ctx.fillStyle = '#3d6b3f';
      ctx.beginPath(); ctx.ellipse(0,-8,26,16,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(-16,-2,16,11,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(16,-2,16,11,0,0,Math.PI*2); ctx.fill();
      // highlights
      ctx.fillStyle = '#5a8a55';
      ctx.beginPath(); ctx.ellipse(-4,-14,10,5,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(12,-8,7,4,0,0,Math.PI*2); ctx.fill();
    } else if (d.kind==='pine'){
      // Pine tree with snow caps
      ctx.fillStyle = '#5a3a22';
      ctx.beginPath(); ctx.roundRect(-4,-12,8,14,2); ctx.fill();
      // three triangle tiers
      ctx.fillStyle = '#2a4a2a';
      ctx.beginPath(); ctx.moveTo(-22,-12); ctx.lineTo(0,-46); ctx.lineTo(22,-12); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-18,-30); ctx.lineTo(0,-58); ctx.lineTo(18,-30); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-14,-46); ctx.lineTo(0,-70); ctx.lineTo(14,-46); ctx.closePath(); ctx.fill();
      // snow on top
      ctx.fillStyle = 'rgba(255,250,255,0.85)';
      ctx.beginPath(); ctx.moveTo(-7,-64); ctx.lineTo(0,-70); ctx.lineTo(7,-64); ctx.lineTo(4,-60); ctx.lineTo(0,-62); ctx.lineTo(-4,-60); ctx.closePath(); ctx.fill();
      // snow on tier edges
      ctx.fillStyle = 'rgba(255,250,255,0.55)';
      ctx.beginPath(); ctx.moveTo(-22,-12); ctx.lineTo(-14,-18); ctx.lineTo(-8,-12); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(22,-12); ctx.lineTo(14,-18); ctx.lineTo(8,-12); ctx.closePath(); ctx.fill();
    } else { // deadtree
      // Dead twisted tree
      ctx.strokeStyle = '#3a2a1a'; ctx.lineWidth = 4; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-2,-44); ctx.stroke();
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(-2,-22); ctx.lineTo(-16,-34); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-2,-30); ctx.lineTo(14,-44); ctx.stroke();
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-16,-34); ctx.lineTo(-22,-46); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(14,-44); ctx.lineTo(22,-58); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-2,-44); ctx.lineTo(-8,-58); ctx.stroke();
    }
    ctx.restore();
  }
}

function drawGround(){
  var step = 10;

  // --- dirt body fill ---
  ctx.beginPath();
  var firstY=null;
  for (var sx=-step; sx<=W+step; sx+=step){
    var wx = sx + camera.x;
    var gy = terrainHeightAt(wx);
    var sp = worldToScreen(wx, gy);
    if (firstY===null){ ctx.moveTo(sp.x, sp.y); firstY=sp.y; }
    else ctx.lineTo(sp.x, sp.y);
  }
  ctx.lineTo(W+step, H+40);
  ctx.lineTo(-step, H+40);
  ctx.closePath();
  var g = ctx.createLinearGradient(0, H*0.35, 0, H);
  g.addColorStop(0, '#b8794a');
  g.addColorStop(0.15, '#9a6435');
  g.addColorStop(0.55, '#5e3a1f');
  g.addColorStop(1, '#2a160a');
  ctx.fillStyle = g;
  ctx.fill();

  // --- grass strip (top of ground, green) ---
  ctx.beginPath();
  for (var sx2=-step; sx2<=W+step; sx2+=step){
    var wx2 = sx2 + camera.x;
    var gy2 = terrainHeightAt(wx2);
    var sp2 = worldToScreen(wx2, gy2);
    if (sx2===-step) ctx.moveTo(sp2.x, sp2.y); else ctx.lineTo(sp2.x, sp2.y);
  }
  ctx.lineWidth = 6;
  ctx.strokeStyle = '#5e8a3a';
  ctx.stroke();
  // grass highlight (lighter line above the dark green)
  ctx.beginPath();
  for (var sx2=-step; sx2<=W+step; sx2+=step){
    var wx2 = sx2 + camera.x;
    var gy2 = terrainHeightAt(wx2) - 1.5;
    var sp2 = worldToScreen(wx2, gy2);
    if (sx2===-step) ctx.moveTo(sp2.x, sp2.y); else ctx.lineTo(sp2.x, sp2.y);
  }
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#7aa84d';
  ctx.stroke();

  // --- grass tufts (small blades) ---
  ctx.strokeStyle = '#4a6b2a'; ctx.lineWidth = 1.2;
  var tuftSlot = Math.floor((camera.x-step)/(step*2));
  var tuftHi = Math.floor((camera.x+W+step)/(step*2));
  for (var ts=tuftSlot; ts<=tuftHi; ts++){
    var tuftWx = ts*step*2 + step;
    var tuftGy = terrainHeightAt(tuftWx);
    var tuftSp = worldToScreen(tuftWx, tuftGy);
    var r = hash01(ts*3.7+1.1);
    if (r > 0.45) continue;
    var h = 3 + r*5;
    ctx.beginPath();
    ctx.moveTo(tuftSp.x, tuftSp.y);
    ctx.lineTo(tuftSp.x - 1 + r*2, tuftSp.y - h);
    ctx.stroke();
  }

  // --- dirt layer separations (parallax stripes for depth) ---
  ctx.strokeStyle = 'rgba(0,0,0,0.18)';
  ctx.lineWidth = 1.5;
  for (var layer=0; layer<3; layer++){
    ctx.beginPath();
    for (var sx3=-step; sx3<=W+step; sx3+=step*2){
      var wx3 = sx3 + camera.x;
      var gy3 = terrainHeightAt(wx3) + 22 + layer*38 + Math.sin(wx3*0.01+layer)*5;
      var sp3 = worldToScreen(wx3, gy3);
      if (sx3===-step) ctx.moveTo(sp3.x, sp3.y); else ctx.lineTo(sp3.x, sp3.y);
    }
    ctx.stroke();
  }

  // --- scattered rocks (deterministic) ---
  var rockSlotLo = Math.floor((camera.x-step)/180)-1;
  var rockSlotHi = Math.floor((camera.x+W+step)/180)+1;
  for (var rs=rockSlotLo; rs<=rockSlotHi; rs++){
    var rr = hash01(rs*5.91+11.3);
    if (rr > 0.5) continue;
    var rwx = rs*180 + hash01(rs*7.7)*120;
    var rgy = terrainHeightAt(rwx) + 25 + rr*180;
    var rsp = worldToScreen(rwx, rgy);
    ctx.fillStyle = '#3a2a1a';
    ctx.beginPath();
    var rsz = 4 + rr*5;
    ctx.ellipse(rsp.x, rsp.y, rsz, rsz*0.6, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,200,140,0.25)';
    ctx.beginPath();
    ctx.ellipse(rsp.x-1, rsp.y-1, rsz*0.6, rsz*0.3, 0, 0, Math.PI*2);
    ctx.fill();
  }
}

function drawCollectibles(t){
  var slotLo = Math.floor((camera.x-80)/COIN_SPACING)-1;
  var slotHi = Math.floor((camera.x+W+80)/COIN_SPACING)+1;
  for (var s=slotLo; s<=slotHi; s++){
    if (collected[s]) continue;
    var item = getSlotItem(s);
    if (!item) continue;
    var gy = terrainHeightAt(item.x)-58;
    var sp = worldToScreen(item.x, gy + Math.sin(t*3+s)*5);
    if (item.type==='coin'){
      var squish = Math.abs(Math.cos(t*2.4+s));
      ctx.save();
      ctx.translate(sp.x, sp.y);
      ctx.scale(Math.max(0.25,squish), 1);
      var cg = ctx.createRadialGradient(-4,-4,1,0,0,15);
      cg.addColorStop(0,'#fff6c9'); cg.addColorStop(0.6,'#ffd166'); cg.addColorStop(1,'#b8860b');
      ctx.beginPath(); ctx.arc(0,0,14,0,Math.PI*2); ctx.fillStyle=cg; ctx.fill();
      ctx.lineWidth=2; ctx.strokeStyle='#8a5a00'; ctx.stroke();
      ctx.restore();
    } else {
      ctx.save();
      ctx.translate(sp.x, sp.y);
      ctx.fillStyle = '#e8e8e8';
      ctx.beginPath(); ctx.roundRect(-11,-16,22,28,4); ctx.fill();
      ctx.fillStyle = '#ff4d4d';
      ctx.beginPath(); ctx.roundRect(-11,-16,22,10,4); ctx.fill();
      ctx.fillStyle = '#c62828';
      ctx.beginPath(); ctx.roundRect(-4,-22,8,7,2); ctx.fill();
      ctx.restore();
    }
  }
}

function drawPops(){
  ctx.textAlign='center'; ctx.font="700 16px 'Fredoka',sans-serif";
  for (var i=0;i<popTexts.length;i++){
    var p = popTexts[i];
    var sp = worldToScreen(p.x,p.y);
    var alpha = 1-(p.life/0.9);
    ctx.globalAlpha = Math.max(0,alpha);
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, sp.x, sp.y - p.life*40);
    ctx.globalAlpha = 1;
  }
}

function drawParticles(){
  for (var i=0;i<particles.length;i++){
    var p = particles[i];
    var sp = worldToScreen(p.x,p.y);
    var a = 1-(p.life/p.maxLife);
    ctx.globalAlpha = Math.max(0,a*0.85);
    var r = p.r;
    if (p.kind==='dust'){
      ctx.fillStyle = '#b8794a';
      r = p.r * (1 + p.life*0.5);
    } else if (p.kind==='smoke'){
      var sg = ctx.createRadialGradient(sp.x, sp.y, 0, sp.x, sp.y, p.r*(1+p.life*2.2));
      sg.addColorStop(0, 'rgba(180,180,180,0.75)');
      sg.addColorStop(1, 'rgba(120,120,130,0)');
      ctx.fillStyle = sg;
      r = p.r * (1 + p.life*2.2);
    } else if (p.kind==='sparkle'){
      ctx.fillStyle = p.color || '#ffd166';
      r = p.r * (1 - p.life*0.4);
    } else { // spark
      ctx.fillStyle = p.life < 0.15 ? '#fff6ea' : '#ffb703';
      r = p.r * (1 - p.life*0.6);
    }
    ctx.beginPath();
    ctx.arc(sp.x, sp.y, Math.max(0.5, r), 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawCar(){
  // shadow (scales with the smaller car)
  var gy = terrainHeightAt(car.x);
  var heightAbove = clamp((gy - (car.y+55*CAR_SCALE))/140, 0, 1);
  var shSp = worldToScreen(car.x, gy);
  ctx.save();
  ctx.globalAlpha = 0.35*(1-heightAbove*0.6);
  ctx.fillStyle = '#150a24';
  ctx.beginPath();
  ctx.ellipse(shSp.x, shSp.y+3, 68*CAR_SCALE*(1-heightAbove*0.3), 12*CAR_SCALE*(1-heightAbove*0.5), 0, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  // struts + wheels (compact offroad tires)
  for (var i=0;i<car.wheels.length;i++){
    var w = car.wheels[i];
    var mount = rotate(w.localX,w.localY,car.angle);
    var mountWorld = {x:car.x+mount.x, y:car.y+mount.y};
    var mSp = worldToScreen(mountWorld.x, mountWorld.y);
    var wSp = worldToScreen(w.x, w.y);

    // suspension strut
    ctx.strokeStyle = '#1a1422';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(mSp.x, mSp.y); ctx.lineTo(wSp.x, wSp.y); ctx.stroke();
    ctx.strokeStyle = '#4a4a55';
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(mSp.x, mSp.y); ctx.lineTo(wSp.x, wSp.y); ctx.stroke();

    // chunky offroad wheel
    ctx.save();
    ctx.translate(wSp.x, wSp.y);
    // tire
    var tireGrad = ctx.createRadialGradient(-3,-3,1.5,0,0,WHEEL_R);
    tireGrad.addColorStop(0,'#3a3540'); tireGrad.addColorStop(0.7,'#181820'); tireGrad.addColorStop(1,'#08080c');
    ctx.beginPath(); ctx.arc(0,0,WHEEL_R,0,Math.PI*2); ctx.fillStyle=tireGrad; ctx.fill();
    // sidewall ring
    ctx.beginPath(); ctx.arc(0,0,WHEEL_R-1.5,0,Math.PI*2);
    ctx.strokeStyle='#1a1a20'; ctx.lineWidth=1.6; ctx.stroke();
    // outer chunky tread (10 lugs, rotated with wheel spin)
    ctx.save();
    ctx.rotate(w.spin);
    ctx.fillStyle = '#0a0a0e';
    for (var k=0;k<10;k++){
      var ang = (k/10)*Math.PI*2;
      ctx.save();
      ctx.rotate(ang);
      ctx.fillRect(WHEEL_R-3.5, -1.3, 2.8, 2.6);
      ctx.restore();
    }
    ctx.restore();
    // hub
    ctx.beginPath(); ctx.arc(0,0,6,0,Math.PI*2);
    var hubG = ctx.createRadialGradient(-1.5,-1.5,0.8,0,0,6);
    hubG.addColorStop(0,'#e8e8e8'); hubG.addColorStop(1,'#7a7a85');
    ctx.fillStyle = hubG; ctx.fill();
    ctx.strokeStyle='#222'; ctx.lineWidth=0.8; ctx.stroke();
    // 5 lug nuts (rotating with wheel)
    ctx.save();
    ctx.rotate(w.spin);
    ctx.fillStyle = '#333';
    for (var lug=0;lug<5;lug++){
      var la = (lug/5)*Math.PI*2;
      ctx.beginPath(); ctx.arc(Math.cos(la)*3.2, Math.sin(la)*3.2, 0.9, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
    ctx.beginPath(); ctx.arc(0,0,1.4,0,Math.PI*2); ctx.fillStyle='#1a1a1a'; ctx.fill();
    ctx.restore();
  }

  // ===== LADA NIVA BODY (compact) =====
  var bSp = worldToScreen(car.x, car.y);
  ctx.save();
  ctx.translate(bSp.x, bSp.y);
  ctx.rotate(car.angle);
  // Scale the entire body+details drawing by CAR_SCALE so all the hardcoded
  // body detail coordinates (headlights, mirrors, etc.) match the smaller car.
  ctx.scale(CAR_SCALE, CAR_SCALE);

  // main body polygon (boxy Lada Niva silhouette)
  ctx.beginPath();
  ctx.moveTo(bodyCorners[0].x, bodyCorners[0].y);
  for (var c=1;c<bodyCorners.length;c++) ctx.lineTo(bodyCorners[c].x, bodyCorners[c].y);
  ctx.closePath();
  // two-tone: upper cream, lower khaki green (classic Niva)
  var bg = ctx.createLinearGradient(0,-30,0,20);
  bg.addColorStop(0,'#efe2c6'); bg.addColorStop(0.55,'#cdbb96');
  bg.addColorStop(0.56,'#6b7d4a'); bg.addColorStop(1,'#475a30');
  ctx.fillStyle = bg; ctx.fill();
  ctx.lineWidth=2.5; ctx.strokeStyle='#15120a'; ctx.stroke();

  // ---- wheel arches (cut into body) ----
  ctx.fillStyle = '#0a0a0e';
  ctx.beginPath(); ctx.arc(-44, 14, WHEEL_R+2, Math.PI, 2*Math.PI); ctx.fill();
  ctx.beginPath(); ctx.arc(46, 12, WHEEL_R+2, Math.PI, 2*Math.PI); ctx.fill();
  // arch trim
  ctx.strokeStyle = '#1a1a14'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(-44, 14, WHEEL_R+2, Math.PI, 2*Math.PI); ctx.stroke();
  ctx.beginPath(); ctx.arc(46, 12, WHEEL_R+2, Math.PI, 2*Math.PI); ctx.stroke();

  // ---- roof rack (compact expedition style) ----
  ctx.strokeStyle = '#1a1a14'; ctx.lineWidth=2; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(-46,-38); ctx.lineTo(34,-40); ctx.lineTo(34,-44); ctx.lineTo(-46,-42); ctx.closePath();
  ctx.stroke();
  ctx.lineWidth=1.5;
  for (var rack=-40; rack<=28; rack+=12){
    ctx.beginPath(); ctx.moveTo(rack,-38); ctx.lineTo(rack,-44); ctx.stroke();
  }

  // ---- windshield + side windows (boxy Niva greenhouse, compact) ----
  ctx.beginPath();
  ctx.moveTo(-40,-36); ctx.lineTo(-18,-36); ctx.lineTo(-18,-20); ctx.lineTo(-48,-20); ctx.closePath();
  ctx.moveTo(-12,-36); ctx.lineTo(32,-38); ctx.lineTo(32,-20); ctx.lineTo(-12,-20); ctx.closePath();
  var wg = ctx.createLinearGradient(0,-36,0,-20);

var fuelFill = document.getElementById('fuelFill');

var distanceNumEl = document.getElementById('distanceNum');

var speedoNeedle = document.getElementById('speedoNeedle');
var PX_PER_METER = 42;
var lastMilestone = 0;

// Build speedometer tick marks (every 30° around 240° arc, 0..~140 km/h)
(function buildSpeedoTicks(){
  var g = document.getElementById('speedoTicks');
  if (!g) return;
  var svgNS = 'http://www.w3.org/2000/svg';
  // arc from -210° (left) to +30° (right) — 240° total
  for (var i=0;i<=8;i++){
    var t = i/8;
    var angDeg = -210 + t*240;
    var ang = angDeg * Math.PI/180;
    var x1 = 30 + Math.cos(ang)*22, y1 = 30 + Math.sin(ang)*22;
    var x2 = 30 + Math.cos(ang)*26, y2 = 30 + Math.sin(ang)*26;
    var line = document.createElementNS(svgNS, 'line');
    line.setAttribute('x1', x1); line.setAttribute('y1', y1);
    line.setAttribute('x2', x2); line.setAttribute('y2', y2);
    line.setAttribute('stroke', i>=6 ? '#ff6b4a' : (i>=4 ? '#ffd56b' : 'rgba(255,255,255,.55)'));
    line.setAttribute('stroke-width', i%2===0 ? 1.8 : 1);
    g.appendChild(line);
  }
})();

// Milestone notifications: 100m, 250m, 500m, 1000m, then every 500m.
function checkMilestone(meters){
  var milestones = [100, 250, 500, 1000, 1500, 2000, 2500, 3000, 4000, 5000];
  for (var i=0;i<milestones.length;i++){
    var m = milestones[i];
    if (meters >= m && lastMilestone < m){
      lastMilestone = m;
      spawnPop(car.x, car.y - 80, m + ' МЕТРОВ!', '#ffd56b');
      haptic('success');
      camera.shake = Math.min(1.2, camera.shake + 0.5);
      return;
    }
  }
}

function updateHUD(){
  var pct = clamp(car.fuel,0,100);
  fuelFill.style.width = pct+'%';
  fuelFill.style.background = pct>40
    ? 'linear-gradient(90deg,#5be37b,#a8e05f)'
    : (pct>15 ? 'linear-gradient(90deg,#ffd166,#ffb703)' : 'linear-gradient(90deg,#ff6b4a,#ff4d5e)');
  fuelWrap.classList.toggle('low', pct<=15);
  coinCountEl.textContent = car.coins;
  var meters = Math.max(0, Math.floor((car.maxX-260)/PX_PER_METER));
  distanceNumEl.textContent = meters;
  // Speedometer — px/s -> km/h style (PX_PER_METER=42, so divide by 42 then *3.6)
  var speedMs = Math.sqrt(car.vx*car.vx + car.vy*car.vy) / PX_PER_METER;
  var speedKmh = Math.round(speedMs * 3.6);
  if (speedNumEl) speedNumEl.textContent = speedKmh;
  // Rotate needle: 0 km/h -> -210°, 140+ km/h -> +30°
  if (speedoNeedle){
    var t = clamp(speedKmh / 140, 0, 1);
    var ang = -210 + t*240;
    speedoNeedle.setAttribute('transform', 'rotate(' + ang + ' 30 30)');
  }
  checkMilestone(meters);
}

/* ============================================================
   GAME STATE MACHINE
   ============================================================ */
var STATE = {START:'start', PLAYING:'playing', PAUSED:'paused', OVER:'over'};
var state = STATE.START;

var hudEl = document.getElementById('hud');
var controlsEl = document.getElementById('controls');
var startScreen = document.getElementById('startScreen');
var pauseScreen = document.getElementById('pauseScreen');
var gameOverScreen = document.getElementById('gameOverScreen');
var loadingScreen = document.getElementById('loadingScreen');

var BEST_KEY = 'dmitryLixxxBest_v2';
function getBest(){
  try{ return JSON.parse(localStorage.getItem(BEST_KEY)) || {distance:0, coins:0}; }
  catch(e){ return {distance:0, coins:0}; }
}
function setBest(d,c){
  try{ localStorage.setItem(BEST_KEY, JSON.stringify({distance:d, coins:c})); }catch(e){}
}

function refreshStartStats(){
  var b = getBest();
  document.getElementById('bestDistanceStart').textContent = b.distance+' m';
  document.getElementById('bestCoinsStart').textContent = b.coins;
}
refreshStartStats();

function startGame(){
  initAudio();
  resetCar();
  particles.length = 0; popTexts.length = 0;
  collected = {};
  maxDistancePx = 0;
  lastMilestone = 0;
  camera.x = car.x - W*0.38; camera.y = car.y - H*0.56;
  state = STATE.PLAYING;
  startScreen.classList.add('hidden');
  gameOverScreen.classList.add('hidden');
  pauseScreen.classList.add('hidden');
  hudEl.classList.add('show');
  controlsEl.classList.add('show');
}

function togglePause(){
  if (state===STATE.PLAYING){
    state = STATE.PAUSED;
    pauseScreen.classList.remove('hidden');
  } else if (state===STATE.PAUSED){
    state = STATE.PLAYING;
    pauseScreen.classList.add('hidden');
  }
}

function endGame(){
  state = STATE.OVER;
  hudEl.classList.remove('show');
  controlsEl.classList.remove('show');
  var meters = Math.max(0, Math.floor((car.maxX-260)/PX_PER_METER));
  var best = getBest();
  var isNew = meters > best.distance;
  if (isNew) setBest(meters, Math.max(car.coins, best.coins));
  else if (car.coins > best.coins) setBest(best.distance, car.coins);

  document.getElementById('gameOverTitle').textContent = car.crashReason==='fuel' ? 'ТОПЛИВО КОНЧИЛОСЬ' : 'РАЗБИЛСЯ!';
  document.getElementById('finalDistance').textContent = meters;
  document.getElementById('finalCoins').textContent = car.coins;
  document.getElementById('finalBest').textContent = Math.max(meters, best.distance);
  document.getElementById('newBestBadge').style.display = isNew ? 'inline-block' : 'none';
  gameOverScreen.classList.remove('hidden');
  refreshStartStats();
}

document.getElementById('playBtn').addEventListener('click', startGame);
document.getElementById('retryBtn').addEventListener('click', startGame);
document.getElementById('menuBtn').addEventListener('click', function(){
  gameOverScreen.classList.add('hidden');
  startScreen.classList.remove('hidden');
});
document.getElementById('resumeBtn').addEventListener('click', togglePause);
document.getElementById('pauseBtn').addEventListener('click', togglePause);
document.getElementById('restartFromPauseBtn').addEventListener('click', function(){
  pauseScreen.classList.add('hidden');
  startGame();
});

/* ============================================================
   MAIN LOOP — fixed timestep physics, variable-rate rendering
   ============================================================ */
var FIXED_DT = 1/60;
var MAX_SUBSTEPS = 5;
var accumulator = 0;
var lastTime = performance.now();
var clock = 0;

function frame(now){
  requestAnimationFrame(frame);
  var dt = Math.min(0.05, (now-lastTime)/1000);
  lastTime = now;
  clock += dt;

  if (state===STATE.PLAYING){
    accumulator += dt;
    var steps=0;
    while (accumulator >= FIXED_DT && steps<MAX_SUBSTEPS){
      stepPhysics(FIXED_DT, input);
      accumulator -= FIXED_DT;
      steps++;
      if (car.crashed) { accumulator=0; break; }
    }
    updateParticles(dt);
    updatePops(dt);
    updateCamera(dt);
    updateEngineAudio();
    updateHUD();
    if (car.crashed){
      setTimeout(function(){ if(state===STATE.PLAYING) endGame(); }, 650);
      state = 'crashing';
    }
  } else if (state==='crashing'){
    updateParticles(dt);
    updatePops(dt);
    updateCamera(dt);
  } else {
    updateParticles(dt);
    updatePops(dt);
  }

  render();
}

function render(){
  drawSky();
  // Three mountain layers, far-to-near. BaseY is high on screen (smaller Y) so the
  // mountains rise well above the terrain. Colors are MUCH darker than the dusk sky
  // so the silhouettes contrast clearly (previous tint matched the sky and vanished).
  drawMountainLayer(H*0.50, 70, 0.0011, 0.10, 'rgba(18,10,28,0.75)', 4.2, null);
  drawMountainLayer(H*0.60, 110, 0.0007, 0.20, 'rgba(28,16,40,0.88)', 91.3, null);
  drawMountainLayer(H*0.70, 160, 0.0005, 0.36, 'rgba(40,24,52,1.0)', 187.4, 'rgba(245,235,255,0.6)');
  drawClouds();
  drawMidgroundTrees();
  drawDecorations();
  drawGround();
  drawTrackMarkers();
  drawCollectibles(clock);
  if (car) drawCar();
  drawParticles();
  drawPops();
}

loadingScreen.style.display = 'none';
requestAnimationFrame(function(t){ lastTime=t; requestAnimationFrame(frame); });

(function drawPreviewCar(){

  // gameplay car is now smaller.
  var s = 2.0;

  // so the preview matches the actual gameplay proportions.
  function drawWheel(x, y){
    pctx.save(); pctx.translate(x, y);

    tireG.addColorStop(0,'#3a3540'); tireG.addColorStop(0.7,'#181820'); tireG.addColorStop(1,'#08080c');
    pctx.beginPath(); pctx.arc(0,0,WHEEL_R,0,Math.PI*2); pctx.fillStyle=tireG; pctx.fill();

      pctx.save(); pctx.rotate(ang);
      pctx.fillRect(WHEEL_R-3.5, -1.3, 2.8, 2.6);
      pctx.restore();
    }
    pctx.beginPath(); pctx.arc(0,0,6,0,Math.PI*2);
    var hg = pctx.createRadialGradient(-1.5,-1.5,0.8,0,0,6);
    hg.addColorStop(0,'#e8e8e8'); hg.addColorStop(1,'#7a7a85');
    pctx.fillStyle=hg; pctx.fill();
    pctx.strokeStyle='#222'; pctx.lineWidth=0.8; pctx.stroke();

  pctx.closePath();
  var bg = pctx.createLinearGradient(0,-30,0,20);

  pctx.beginPath(); pctx.arc(46, 12, WHEEL_R+2, Math.PI, 2*Math.PI); pctx.fill();

  // roof rack

  pctx.stroke();

  // windows
  pctx.beginPath();
  pctx.moveTo(-40,-36); pctx.lineTo(-18,-36); pctx.lineTo(-18,-20); pctx.lineTo(-48,-20); pctx.closePath();
  pctx.moveTo(-12,-36); pctx.lineTo(32,-38); pctx.lineTo(32,-20); pctx.lineTo(-12,-20); pctx.closePath();
  var wg = pctx.createLinearGradient(0,-36,0,-20);

  pctx.fillStyle = wg; pctx.fill();
  pctx.lineWidth=1.5; pctx.strokeStyle='#15120a'; pctx.stroke();

  pctx.beginPath(); pctx.arc(56,-10,4,0,Math.PI*2);
  var hg2 = pctx.createRadialGradient(55,-11,1,56,-10,4);
  hg2.addColorStop(0,'#fffadc'); hg2.addColorStop(0.5,'#ffe066'); hg2.addColorStop(1,'#a87405');
  pctx.fillStyle = hg2; pctx.fill();

  pctx.beginPath(); pctx.roundRect(44,-6,10,8,1.5); pctx.fill();

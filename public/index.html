<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<title>Dmitry_Lixxx на бездорожье</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #050811;
    font-family: 'Inter', 'SF Pro Display', -apple-system, 'Segoe UI', system-ui, sans-serif;
    touch-action: none;
    overscroll-behavior: none;
  }
  #game-container { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
  canvas { display: block; touch-action: none; }

  /* ===== START SCREEN ===== */
  #start-screen {
    position: absolute; inset: 0; z-index: 100;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(255, 140, 50, 0.25), transparent 60%),
      radial-gradient(ellipse at 70% 80%, rgba(100, 65, 165, 0.3), transparent 60%),
      linear-gradient(180deg, #0a0e1a 0%, #1a1530 40%, #2a1f3a 70%, #4a2e1a 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: white; text-align: center; padding: 24px;
    transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }
  #start-screen.hidden { opacity: 0; pointer-events: none; transform: scale(1.05); }

  .streamer-badge {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 16px;
    background: linear-gradient(135deg, rgba(255, 60, 80, 0.95), rgba(180, 30, 50, 0.95));
    border-radius: 100px;
    font-size: clamp(0.7rem, 2.2vw, 0.9rem);
    color: #fff; font-weight: 700;
    margin-bottom: 18px;
    box-shadow: 0 4px 24px rgba(255, 60, 80, 0.5), inset 0 1px 0 rgba(255,255,255,0.3);
    letter-spacing: 0.5px;
    animation: badgePulse 2.4s ease-in-out infinite;
  }
  .streamer-badge::before {
    content: ''; width: 8px; height: 8px; border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 12px #fff;
    animation: dotPulse 1.2s ease-in-out infinite;
  }
  @keyframes badgePulse {
    0%, 100% { box-shadow: 0 4px 24px rgba(255, 60, 80, 0.5), inset 0 1px 0 rgba(255,255,255,0.3); }
    50% { box-shadow: 0 4px 32px rgba(255, 60, 80, 0.8), inset 0 1px 0 rgba(255,255,255,0.3); }
  }
  @keyframes dotPulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(0.7); }
  }

  .title-wrap { position: relative; margin-bottom: 12px; }
  .title-main {
    font-size: clamp(2.2rem, 8vw, 5.2rem); font-weight: 900;
    letter-spacing: -1.5px; line-height: 0.95;
    background: linear-gradient(180deg, #fff 0%, #ffe066 40%, #ff9933 80%, #cc5500 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 4px 20px rgba(255, 150, 0, 0.4)) drop-shadow(0 2px 4px rgba(0,0,0,0.8));
  }
  .title-sub {
    font-size: clamp(1rem, 3.2vw, 1.8rem); font-weight: 700;
    color: #fff;
    margin-top: 6px;
    letter-spacing: 0.5px;
    text-shadow: 0 2px 12px rgba(0,0,0,0.8);
    opacity: 0.92;
  }

  .niva-preview {
    width: clamp(180px, 38vw, 280px);
    margin: 18px 0 24px;
    filter: drop-shadow(0 16px 40px rgba(0,0,0,0.5)) drop-shadow(0 4px 8px rgba(255,140,0,0.2));
    animation: nivaFloat 3s ease-in-out infinite;
  }
  @keyframes nivaFloat {
    0%, 100% { transform: translateY(0) rotate(-1deg); }
    50% { transform: translateY(-14px) rotate(1deg); }
  }

  .start-button {
    margin-top: 8px;
    padding: 18px 64px;
    font-size: clamp(1.2rem, 4vw, 1.6rem);
    font-weight: 800;
    font-family: inherit;
    color: #fff;
    background: linear-gradient(135deg, #ff8c1a 0%, #ff5500 50%, #cc3300 100%);
    border: none;
    border-radius: 100px;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(255, 80, 0, 0.5), 0 4px 12px rgba(0,0,0,0.4),
                inset 0 1px 0 rgba(255,255,255,0.3);
    transition: transform 0.12s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.12s;
    letter-spacing: 1px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    position: relative;
    overflow: hidden;
  }
  .start-button::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    transform: translateX(-100%);
    transition: transform 0.6s;
  }
  .start-button:hover::before { transform: translateX(100%); }
  .start-button:active {
    transform: translateY(4px) scale(0.98);
    box-shadow: 0 4px 12px rgba(255, 80, 0, 0.4), 0 2px 4px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.2);
  }

  .controls-hint {
    margin-top: 28px;
    font-size: clamp(0.75rem, 2vw, 0.9rem);
    color: rgba(255,255,255,0.6);
    font-weight: 500;
    line-height: 1.7;
    max-width: 380px;
  }
  .controls-hint b { color: #ffd700; font-weight: 700; }

  /* ===== HUD ===== */
  #hud {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 14px 16px;
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none;
    z-index: 50;
  }
  .hud-left, .hud-right {
    display: flex; flex-direction: column; gap: 8px;
  }
  .hud-right { align-items: flex-end; }
  .hud-pill {
    display: flex; align-items: center; gap: 8px;
    font-size: clamp(0.95rem, 2.8vw, 1.3rem);
    font-weight: 800;
    color: #fff;
    background: rgba(10, 14, 26, 0.65);
    padding: 8px 14px;
    border-radius: 100px;
    border: 1px solid rgba(255,255,255,0.12);
    backdrop-filter: blur(12px) saturate(180%);
    -webkit-backdrop-filter: blur(12px) saturate(180%);
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    letter-spacing: 0.3px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.6);
  }
  .hud-icon { font-size: 1.1em; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
  .fuel-bar-wrap {
    width: clamp(110px, 26vw, 180px);
    height: 14px;
    background: rgba(0,0,0,0.5);
    border-radius: 100px;
    overflow: hidden;
    border: 1.5px solid rgba(255,255,255,0.2);
    position: relative;
  }
  .fuel-bar {
    height: 100%;
    background: linear-gradient(90deg, #00ff88 0%, #ffd700 60%, #ff6b35 100%);
    transition: width 0.25s cubic-bezier(0.4, 0, 0.2, 1), background 0.3s;
    border-radius: 100px;
    box-shadow: 0 0 12px rgba(255, 215, 0, 0.5);
  }
  .fuel-bar.low {
    background: linear-gradient(90deg, #ff3333, #ff0000);
    animation: fuelPulse 0.4s infinite;
  }
  @keyframes fuelPulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 12px rgba(255, 50, 50, 0.8); }
    50% { opacity: 0.7; box-shadow: 0 0 20px rgba(255, 0, 0, 1); }
  }

  /* ===== TOUCH CONTROLS ===== */
  #touch-controls {
    position: absolute; bottom: 0; left: 0; right: 0;
    display: flex; justify-content: space-between;
    padding: 24px 32px calc(24px + env(safe-area-inset-bottom));
    pointer-events: none;
    z-index: 50;
  }
  .pedal {
    pointer-events: auto;
    width: clamp(90px, 20vw, 140px);
    height: clamp(90px, 20vw, 140px);
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.85);
    font-size: clamp(0.9rem, 2.6vw, 1.2rem);
    font-weight: 900;
    font-family: inherit;
    color: #fff;
    text-shadow: 0 2px 6px rgba(0,0,0,0.6);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.08s cubic-bezier(0.4, 0, 0.2, 1);
    backdrop-filter: blur(12px) saturate(180%);
    -webkit-backdrop-filter: blur(12px) saturate(180%);
    letter-spacing: 0.5px;
    position: relative;
    overflow: hidden;
  }
  .pedal::before {
    content: '';
    position: absolute; inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 25%, rgba(255,255,255,0.25), transparent 50%);
    pointer-events: none;
  }
  .pedal:active, .pedal.pressed {
    transform: scale(0.9);
  }
  #gas-pedal {
    background: linear-gradient(135deg, #4caf50, #1b5e20);
    box-shadow: 0 8px 24px rgba(76, 175, 80, 0.5), inset 0 2px 0 rgba(255,255,255,0.3),
                inset 0 -4px 0 rgba(0,0,0,0.3);
  }
  #gas-pedal:active, #gas-pedal.pressed {
    box-shadow: 0 2px 8px rgba(76, 175, 80, 0.4), inset 0 2px 0 rgba(255,255,255,0.2),
                inset 0 -2px 0 rgba(0,0,0,0.3);
  }
  #brake-pedal {
    background: linear-gradient(135deg, #f44336, #8e1414);
    box-shadow: 0 8px 24px rgba(244, 67, 54, 0.5), inset 0 2px 0 rgba(255,255,255,0.3),
                inset 0 -4px 0 rgba(0,0,0,0.3);
  }
  #brake-pedal:active, #brake-pedal.pressed {
    box-shadow: 0 2px 8px rgba(244, 67, 54, 0.4), inset 0 2px 0 rgba(255,255,255,0.2),
                inset 0 -2px 0 rgba(0,0,0,0.3);
  }

  /* ===== GAME OVER SCREEN ===== */
  #game-over {
    position: absolute; inset: 0; z-index: 90;
    background: rgba(5, 8, 17, 0.85);
    backdrop-filter: blur(20px) saturate(120%);
    -webkit-backdrop-filter: blur(20px) saturate(120%);
    display: none;
    flex-direction: column; align-items: center; justify-content: center;
    color: white; text-align: center; padding: 24px;
  }
  #game-over.show { display: flex; animation: gameOverIn 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
  @keyframes gameOverIn {
    from { opacity: 0; backdrop-filter: blur(0); }
    to { opacity: 1; backdrop-filter: blur(20px); }
  }
  .game-over-title {
    font-size: clamp(2.5rem, 8vw, 4.5rem); font-weight: 900;
    background: linear-gradient(180deg, #ff4444, #aa0000);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 4px 12px rgba(255, 0, 0, 0.5));
    margin-bottom: 12px;
    letter-spacing: -1px;
    animation: crashShake 0.5s ease;
  }
  @keyframes crashShake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px) rotate(-1deg); }
    75% { transform: translateX(6px) rotate(1deg); }
  }
  .game-over-reason {
    font-size: clamp(0.95rem, 2.8vw, 1.2rem); font-weight: 600;
    color: #ffd700;
    margin-bottom: 24px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    max-width: 400px;
  }
  .game-over-stats {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 12px; margin-bottom: 28px;
    min-width: clamp(280px, 85vw, 420px);
  }
  .stat-card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px;
    padding: 14px 18px;
    backdrop-filter: blur(8px);
  }
  .stat-label {
    font-size: 0.72rem; color: rgba(255,255,255,0.55);
    font-weight: 700; letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  .stat-value {
    font-size: clamp(1.4rem, 4.2vw, 1.8rem); font-weight: 900;
    color: #ffd700;
    text-shadow: 0 2px 8px rgba(255, 215, 0, 0.3);
    margin-top: 4px;
  }
  .restart-button {
    padding: 16px 56px;
    font-size: clamp(1.1rem, 3.5vw, 1.4rem);
    font-weight: 800;
    font-family: inherit;
    color: #fff;
    background: linear-gradient(135deg, #4caf50, #2e7d32);
    border: none;
    border-radius: 100px;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(76, 175, 80, 0.5), inset 0 1px 0 rgba(255,255,255,0.3);
    transition: transform 0.12s, box-shadow 0.12s;
    letter-spacing: 1px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.3);
  }
  .restart-button:active {
    transform: translateY(3px) scale(0.98);
    box-shadow: 0 4px 12px rgba(76, 175, 80, 0.4), inset 0 1px 0 rgba(255,255,255,0.2);
  }

  /* ===== LOADING ===== */
  #loading {
    position: absolute; inset: 0; z-index: 200;
    background: #050811;
    display: flex; align-items: center; justify-content: center;
    color: #ffd700; font-size: 1rem; font-weight: 600;
    flex-direction: column; gap: 16px;
    letter-spacing: 1px;
  }
  #loading.hidden { display: none; }
  .loading-bar {
    width: 220px; height: 4px;
    background: rgba(255,255,255,0.08);
    border-radius: 100px; overflow: hidden;
  }
  .loading-bar-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #ffd700, #ff8c1a);
    border-radius: 100px;
    box-shadow: 0 0 12px rgba(255, 215, 0, 0.6);
    animation: loadingAnim 2s ease-in-out infinite;
  }
  @keyframes loadingAnim {
    0% { width: 0%; }
    50% { width: 75%; }
    100% { width: 100%; }
  }
</style>
</head>
<body>
<div id="game-container">

  <div id="loading">
    <div>ЗАГРУЗКА...</div>
    <div class="loading-bar"><div class="loading-bar-fill"></div></div>
  </div>

  <div id="start-screen" class="hidden">
    <div class="streamer-badge">LIVE • стример</div>
    <div class="title-wrap">
      <div class="title-main">Dmitry_Lixxx</div>
      <div class="title-sub">на бездорожье</div>
    </div>
    <img class="niva-preview" src="/sprites/niva_side.png" alt="">
    <button class="start-button" id="start-btn">ГОНЯТЬ</button>
    <div class="controls-hint">
      <b>Тач:</b> справа газ, слева тормоз<br>
      <b>Клава:</b> → газ, ← тормоз<br><br>
      Проедь как можно дальше. Не перевернись.
    </div>
  </div>

  <div id="hud" style="display:none;">
    <div class="hud-left">
      <div class="hud-pill"><span class="hud-icon">📏</span><span id="distance-val">0 м</span></div>
      <div class="hud-pill"><span class="hud-icon">🪙</span><span id="coins-val">0</span></div>
    </div>
    <div class="hud-right">
      <div class="hud-pill">
        <span class="hud-icon">⛽</span>
        <div class="fuel-bar-wrap"><div class="fuel-bar" id="fuel-bar" style="width:100%;"></div></div>
      </div>
      <div class="hud-pill"><span class="hud-icon">🏆</span><span id="best-val">0 м</span></div>
    </div>
  </div>

  <div id="touch-controls" style="display:none;">
    <button class="pedal" id="brake-pedal">◀ ТОРМ</button>
    <button class="pedal" id="gas-pedal">ГАЗ ▶</button>
  </div>

  <div id="game-over">
    <div class="game-over-title">CRASH</div>
    <div class="game-over-reason" id="game-over-reason"></div>
    <div class="game-over-stats">
      <div class="stat-card"><div class="stat-label">ДИСТАНЦИЯ</div><div class="stat-value" id="final-distance">0 м</div></div>
      <div class="stat-card"><div class="stat-label">МОНЕТЫ</div><div class="stat-value" id="final-coins">0</div></div>
      <div class="stat-card"><div class="stat-label">РЕКОРД</div><div class="stat-value" id="final-best">0 м</div></div>
      <div class="stat-card"><div class="stat-label">ОЧКИ</div><div class="stat-value" id="final-score">0</div></div>
    </div>
    <button class="restart-button" id="restart-btn">ЕЩЁ РАЗ</button>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/planck@1.0.0/dist/planck.min.js"></script>

<script>
'use strict';

// ============================================================
//  Dmitry_Lixxx на бездорожье — v2.0 modern visual
// ============================================================

const CFG = {
  GRAVITY_Y: 1400,
  PHYSICS_STEP: 1/60,
  VEL_ITER: 10,
  POS_ITER: 4,
  CAR_W: 120, CAR_H: 32,
  CAR_DENSITY: 0.0018,
  WHEEL_RADIUS: 28,
  WHEEL_DENSITY: 0.0028,
  WHEEL_FRICTION: 3.5,
  SUSPENSION_FREQ: 5.5,
  SUSPENSION_DAMP: 0.55,
  MOTOR_SPEED: 32,
  REVERSE_SPEED: -18,
  MOTOR_TORQUE: 180000,
  TERRAIN_STEP: 28,
  TERRAIN_BASE_Y: 560,
  TERRAIN_INITIAL_FLAT: 10,
  FUEL_MAX: 100,
  FUEL_DRAIN_IDLE: 0.9,
  FUEL_DRAIN_GAS: 2.8,
  FUEL_PICKUP: 38,
  COIN_VALUE: 1,
  CAM_LERP: 0.12,
  CAM_OFFSET_X: 220,
  CAM_OFFSET_Y: -70,
  CAM_ZOOM: 0.85,
  CAM_SNAP_FIRST: true,
};

const S = {
  scene: null, world: null,
  groundBodies: [], terrainPoints: [], terrainSegmentsGenerated: 0,
  carBody: null, carSprite: null,
  wheelFront: null, wheelBack: null,
  wheelFSprite: null, wheelBSprite: null,
  wheelJointBack: null, wheelJointFront: null,
  driverSprite: null, driverTargetRot: 0,
  fuel: CFG.FUEL_MAX, coins: 0, distance: 0, maxDistance: 0, best: 0,
  gameState: 'menu',
  inputGas: false, inputBrake: false,
  pickups: [],
  dirtEmitter: null, exhaustEmitter: null, sparkEmitter: null, dustEmitter: null,
  audio: null,
  flipTimer: 0,
  terrainFillGraphics: null,
  parallax: { sky: null, mountainsFar: null, mountainsMid: null, hills: null, trees: [] },
  lastDirtTime: 0,
  startedMoving: false,
  shake: 0,
  vignette: null,
};

// ============================================================
//  AUDIO
// ============================================================
class GameAudio {
  constructor() { this.ctx = null; this.enabled = true; }
  init() {
    if (this.ctx) return;
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this._setupEngine();
    } catch(e) { this.enabled = false; }
  }
  _setupEngine() {
    this.engineOsc = this.ctx.createOscillator();
    this.engineOsc.type = 'sawtooth'; this.engineOsc.frequency.value = 50;
    this.engineOsc2 = this.ctx.createOscillator();
    this.engineOsc2.type = 'square'; this.engineOsc2.frequency.value = 75;
    this.engineFilter = this.ctx.createBiquadFilter();
    this.engineFilter.type = 'lowpass'; this.engineFilter.frequency.value = 350; this.engineFilter.Q.value = 6;
    this.engineGain = this.ctx.createGain(); this.engineGain.gain.value = 0;
    this.engineOsc.connect(this.engineFilter); this.engineOsc2.connect(this.engineFilter);
    this.engineFilter.connect(this.engineGain); this.engineGain.connect(this.ctx.destination);
    this.engineOsc.start(); this.engineOsc2.start();
  }
  setEngine(throttle, speed) {
    if (!this.enabled || !this.ctx) return;
    const t = this.ctx.currentTime;
    const f = 45 + throttle * 65 + Math.abs(speed) * 0.18;
    const g = 0.05 + throttle * 0.14;
    const filt = 280 + throttle * 450 + Math.abs(speed) * 0.5;
    this.engineOsc.frequency.setTargetAtTime(f, t, 0.08);
    this.engineOsc2.frequency.setTargetAtTime(f * 1.5, t, 0.08);
    this.engineFilter.frequency.setTargetAtTime(filt, t, 0.08);
    this.engineGain.gain.setTargetAtTime(g, t, 0.1);
  }
  stopEngine() { if (this.enabled && this.ctx) this.engineGain.gain.setTargetAtTime(0, this.ctx.currentTime, 0.1); }
  coin() {
    if (!this.enabled || !this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = 'square'; o.frequency.setValueAtTime(880, t);
    o.frequency.exponentialRampToValueAtTime(1760, t + 0.08);
    g.gain.setValueAtTime(0.12, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(t); o.stop(t + 0.15);
  }
  fuel() {
    if (!this.enabled || !this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(440, t);
    o.frequency.linearRampToValueAtTime(880, t + 0.2);
    g.gain.setValueAtTime(0.16, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(t); o.stop(t + 0.3);
  }
  crash() {
    if (!this.enabled || !this.ctx) return;
    const t = this.ctx.currentTime;
    const bs = this.ctx.sampleRate * 0.5;
    const b = this.ctx.createBuffer(1, bs, this.ctx.sampleRate);
    const d = b.getChannelData(0);
    for (let i = 0; i < bs; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / bs);
    const n = this.ctx.createBufferSource(); n.buffer = b;
    const f = this.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 600;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.45, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
    n.connect(f); f.connect(g); g.connect(this.ctx.destination);
    n.start(t); n.stop(t + 0.5);
  }
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); }
}

// ============================================================
//  TERRAIN
// ============================================================
function generateTerrainPoint(i) {
  if (i < CFG.TERRAIN_INITIAL_FLAT) return CFG.TERRAIN_BASE_Y;
  const x = i * CFG.TERRAIN_STEP;
  let y = CFG.TERRAIN_BASE_Y;
  y += Math.sin(x * 0.005) * 75;
  y += Math.sin(x * 0.013) * 38;
  y += Math.sin(x * 0.029) * 18;
  y += Math.sin(x * 0.061) * 9;
  y += Math.sin(x * 0.13) * 4;
  if (x > 4000) y += Math.sin(x * 0.008) * (Math.min(70, (x - 4000) * 0.02));
  if (x > 8000) y += Math.sin(x * 0.011) * 50;
  return y;
}

function extendTerrain(scene, world, upToIndex) {
  const STEP = CFG.TERRAIN_STEP;
  while (S.terrainSegmentsGenerated < upToIndex) {
    const i = S.terrainSegmentsGenerated;
    const p1x = i * STEP, p1y = generateTerrainPoint(i);
    const p2x = (i+1) * STEP, p2y = generateTerrainPoint(i+1);
    if (!S.terrainPoints[i]) S.terrainPoints[i] = {x: p1x, y: p1y};
    if (!S.terrainPoints[i+1]) S.terrainPoints[i+1] = {x: p2x, y: p2y};

    const thickness = 400;
    const verts = [
      planck.Vec2(p1x, p1y), planck.Vec2(p2x, p2y),
      planck.Vec2(p2x, p2y + thickness), planck.Vec2(p1x, p1y + thickness),
    ];
    const gd = world.createBody({type: 'static', position: planck.Vec2(0, 0)});
    gd.createFixture(planck.Polygon(verts), {friction: 1.0, restitution: 0.0});
    S.groundBodies.push(gd);

    if (i > CFG.TERRAIN_INITIAL_FLAT + 2 && i % 11 === 0) {
      const px = (i + 0.5) * STEP;
      const py = generateTerrainPoint(i + 0.5) - 45;
      if (Math.random() < 0.72) {
        for (let k = -1; k <= 1; k++) spawnPickup(scene, world, px + k*34, py + Math.sin(k)*10, 'coin');
      } else {
        spawnPickup(scene, world, px, py, 'fuel');
      }
    }
    if (i > CFG.TERRAIN_INITIAL_FLAT + 5 && i % 22 === 0 && Math.random() < 0.65) {
      const tx = (i + 0.5) * STEP;
      const ty = generateTerrainPoint(i + 0.5);
      spawnTree(scene, tx, ty);
    }
    S.terrainSegmentsGenerated++;
  }
}

function spawnPickup(scene, world, x, y, type) {
  let sprite;
  if (type === 'coin') {
    sprite = scene.add.image(x, y, 'coin').setDisplaySize(24, 24).setDepth(5);
  } else {
    sprite = scene.add.image(x, y, 'fuel').setDisplaySize(36, 36).setDepth(5);
  }
  const body = world.createBody({type: 'static', position: planck.Vec2(x, y)});
  body.createFixture(planck.Circle(22), {isSensor: true});
  S.pickups.push({sprite, body, type, collected: false, baseY: y, phase: Math.random() * Math.PI * 2});
}

function spawnTree(scene, x, y) {
  const c = scene.add.container(x, y);
  const trunk = scene.add.rectangle(0, -22, 14, 44, 0x3a2515).setAlpha(0.95);
  const trunkHi = scene.add.rectangle(-3, -22, 4, 44, 0x5a3a25).setAlpha(0.6);
  const leaves1 = scene.add.triangle(0, -56, -36, 0, 36, 0, 0, -60, 0x1e5a2e);
  const leaves2 = scene.add.triangle(0, -78, -28, 0, 28, 0, 0, -48, 0x2e7a3e);
  const leaves3 = scene.add.triangle(0, -94, -20, 0, 20, 0, 0, -32, 0x3e9a4e);
  c.add([trunk, trunkHi, leaves1, leaves2, leaves3]);
  c.setDepth(2);
  S.parallax.trees.push(c);
}

// ============================================================
//  CAR (Hill Climb Racing style)
// ============================================================
function createCar(scene, world, x, y) {
  const carBody = world.createDynamicBody({position: planck.Vec2(x, y)});
  // Main chassis box
  carBody.createFixture(planck.Box(CFG.CAR_W/2, CFG.CAR_H/2, planck.Vec2(0, 0), 0), {
    density: CFG.CAR_DENSITY, friction: 0.4, restitution: 0.05
  });
  // Cabin fixture (offset up-back, smaller box)
  carBody.createFixture(planck.Box(26, 18, planck.Vec2(-8, -26), 0), {
    density: CFG.CAR_DENSITY * 0.6, friction: 0.4, restitution: 0.05
  });
  carBody.setBullet(true);
  carBody.setFixedRotation(false);
  // Lower center of mass — more stable, less likely to flip
  const massData = {mass: carBody.getMass(), center: planck.Vec2(0, 6), I: carBody.getInertia()};
  carBody.setMassData(massData);

  const wheelBack = world.createDynamicBody({position: planck.Vec2(x - 38, y + 22)});
  wheelBack.createFixture(planck.Circle(CFG.WHEEL_RADIUS), {
    density: CFG.WHEEL_DENSITY, friction: CFG.WHEEL_FRICTION, restitution: 0.1
  });
  wheelBack.setBullet(true);

  const wheelFront = world.createDynamicBody({position: planck.Vec2(x + 38, y + 22)});
  wheelFront.createFixture(planck.Circle(CFG.WHEEL_RADIUS), {
    density: CFG.WHEEL_DENSITY, friction: CFG.WHEEL_FRICTION, restitution: 0.1
  });
  wheelFront.setBullet(true);

  const axis = planck.Vec2(0, 1);
  S.wheelJointBack = world.createJoint(planck.WheelJoint({
    motorSpeed: 0, maxMotorTorque: CFG.MOTOR_TORQUE, enableMotor: true,
    frequencyHz: CFG.SUSPENSION_FREQ, dampingRatio: CFG.SUSPENSION_DAMP,
  }, carBody, wheelBack, wheelBack.getPosition(), axis));

  S.wheelJointFront = world.createJoint(planck.WheelJoint({
    motorSpeed: 0, maxMotorTorque: CFG.MOTOR_TORQUE, enableMotor: true,
    frequencyHz: CFG.SUSPENSION_FREQ, dampingRatio: CFG.SUSPENSION_DAMP,
  }, carBody, wheelFront, wheelFront.getPosition(), axis));

  return {carBody, wheelBack, wheelFront};
}

  g.fillStyle(0x333333, 1);

    const a = (i / 16) * Math.PI * 2;
    const tx = 40 + Math.cos(a) * 36;

  // ===== HCR-STYLE DRIVER HEAD =====

// ============================================================
//  PARALLAX BACKGROUND (multi-layer with depth)
// ============================================================
function createParallax(scene) {
  const W = 2400, H = 1000;

  // === Sky gradient (full sky) ===
  const sky = scene.add.graphics();
  sky.fillGradientStyle(0x1a1f3a, 0x1a1f3a, 0xff7a3a, 0xffa855, 1);
  sky.fillRect(-W, -300, W * 3, H);
  sky.setScrollFactor(0); sky.setDepth(-100);

  // === Sun with glow ===
  const sunX = 1400, sunY = 180;
  // Outer glow rings
  const sunGlow3 = scene.add.circle(sunX, sunY, 180, 0xffa855, 0.08);
  sunGlow3.setScrollFactor(0.05); sunGlow3.setDepth(-99);
  const sunGlow2 = scene.add.circle(sunX, sunY, 130, 0xffd700, 0.15);
  sunGlow2.setScrollFactor(0.05); sunGlow2.setDepth(-99);
  const sunGlow1 = scene.add.circle(sunX, sunY, 90, 0xffe066, 0.3);
  sunGlow1.setScrollFactor(0.05); sunGlow1.setDepth(-99);
  // Sun core
  const sun = scene.add.circle(sunX, sunY, 55, 0xffe066, 1);
  sun.setScrollFactor(0.05); sun.setDepth(-98);
  const sunCore = scene.add.circle(sunX, sunY, 40, 0xffffff, 0.6);
  sunCore.setScrollFactor(0.05); sunCore.setDepth(-98);

  // === Clouds (parallax 0.08) ===
  for (let i = 0; i < 8; i++) {
    const cx = (i * 380 + Math.random() * 200) % 2400 - 200;
    const cy = 80 + Math.random() * 180;
    const cloud = createCloud(scene, cx, cy, 0.5 + Math.random() * 0.5);
    cloud.setScrollFactor(0.08); cloud.setDepth(-97); cloud.setAlpha(0.7);
  }

  // === Far mountains (parallax 0.15) ===
  S.parallax.mountainsFar = scene.add.graphics();
  S.parallax.mountainsFar.setScrollFactor(0.15); S.parallax.mountainsFar.setDepth(-90);
  drawMountainRange(S.parallax.mountainsFar, 580, 130, 7, W * 1.5, 0x3d4e6f, 0x4a5e80);

  // === Mid mountains (parallax 0.3) ===
  S.parallax.mountainsMid = scene.add.graphics();
  S.parallax.mountainsMid.setScrollFactor(0.3); S.parallax.mountainsMid.setDepth(-85);
  drawMountainRange(S.parallax.mountainsMid, 660, 110, 5, W * 1.5, 0x2a3854, 0x384868);

  // === Near hills (parallax 0.55) ===
  S.parallax.hills = scene.add.graphics();
  S.parallax.hills.setScrollFactor(0.55); S.parallax.hills.setDepth(-80);
  drawMountainRange(S.parallax.hills, 740, 80, 4, W * 1.5, 0x1f2a3e, 0x2a3854);
}

function createCloud(scene, x, y, scale) {
  const c = scene.add.container(x, y);
  const main = scene.add.circle(0, 0, 30 * scale, 0xffffff, 0.85);
  const left = scene.add.circle(-22 * scale, 6 * scale, 22 * scale, 0xffffff, 0.85);
  const right = scene.add.circle(22 * scale, 6 * scale, 24 * scale, 0xffffff, 0.85);
  const top = scene.add.circle(0, -14 * scale, 22 * scale, 0xffffff, 0.85);
  c.add([main, left, right, top]);
  return c;
}

function drawMountainRange(g, baseY, amp, count, totalWidth, mainColor, hiColor) {
  // Main fill
  g.fillStyle(mainColor, 1);
  g.beginPath();
  g.moveTo(-300, 1000);
  g.lineTo(-300, baseY);
  for (let i = 0; i <= count; i++) {
    const x = -300 + (i / count) * totalWidth;
    const peakY = baseY - amp - Math.sin(i * 1.3 + 1) * amp * 0.5;
    g.lineTo(x - totalWidth/count/2, baseY - amp * 0.3);
    g.lineTo(x, peakY);
  }
  g.lineTo(totalWidth + 300, baseY);
  g.lineTo(totalWidth + 300, 1000);
  g.closePath();
  g.fillPath();

  // Snow caps
  g.fillStyle(0xffffff, 0.85);
  for (let i = 0; i <= count; i++) {
    const x = -300 + (i / count) * totalWidth;
    const peakY = baseY - amp - Math.sin(i * 1.3 + 1) * amp * 0.5;
    if (amp > 100) {
      g.beginPath();
      g.moveTo(x - 18, peakY + 22);
      g.lineTo(x, peakY);
      g.lineTo(x + 18, peakY + 22);
      g.lineTo(x + 10, peakY + 26);
      g.lineTo(x + 4, peakY + 18);
      g.lineTo(x - 4, peakY + 24);
      g.lineTo(x - 12, peakY + 20);
      g.closePath();
      g.fillPath();
    }
  }

  // Highlight edge (right side, simulating sun)
  g.lineStyle(2, hiColor, 0.6);
  g.beginPath();
  for (let i = 0; i <= count; i++) {
    const x = -300 + (i / count) * totalWidth;
    const peakY = baseY - amp - Math.sin(i * 1.3 + 1) * amp * 0.5;
    if (i === 0) g.moveTo(x, peakY);
    else {
      g.lineTo(x - totalWidth/count/2, baseY - amp * 0.3);
      g.lineTo(x, peakY);
    }
  }
  g.strokePath();
}

// ============================================================
//  TERRAIN RENDERING (layered with grass, dirt, shadows)
// ============================================================
function redrawTerrain(scene) {
  if (S.terrainFillGraphics) S.terrainFillGraphics.destroy();
  const g = scene.add.graphics();
  g.setDepth(-1);

  const pts = S.terrainPoints;
  if (pts.length < 2) return;

  // === Dirt body (gradient sim with 3 layers) ===
  // Layer 1: deep dirt (darkest)
  g.beginPath();
  g.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) g.lineTo(pts[i].x, pts[i].y);
  const lastX = pts[pts.length-1].x;
  g.lineTo(lastX + 300, 1100);
  g.lineTo(pts[0].x - 300, 1100);
  g.closePath();
  g.fillStyle(0x3d2814, 1); g.fillPath();

  // Layer 2: mid dirt (lighter band near top)
  g.beginPath();
  g.moveTo(pts[0].x, pts[0].y + 35);
  for (let i = 1; i < pts.length; i++) g.lineTo(pts[i].x, pts[i].y + 35);
  g.lineTo(lastX + 300, 1100);
  g.lineTo(pts[0].x - 300, 1100);
  g.closePath();
  g.fillStyle(0x5a3a1e, 1); g.fillPath();

  // Layer 3: top soil (lightest, near grass)
  g.beginPath();
  g.moveTo(pts[0].x, pts[0].y + 12);
  for (let i = 1; i < pts.length; i++) g.lineTo(pts[i].x, pts[i].y + 12);
  g.lineTo(lastX + 300, 1100);
  g.lineTo(pts[0].x - 300, 1100);
  g.closePath();
  g.fillStyle(0x7a4a24, 1); g.fillPath();

  // === Grass top (thick green band) ===
  g.lineStyle(10, 0x3a8a3a, 1);
  g.beginPath();
  g.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) g.lineTo(pts[i].x, pts[i].y);
  g.strokePath();

  // Grass highlights
  g.lineStyle(4, 0x4ea84e, 1);
  g.beginPath();
  g.moveTo(pts[0].x, pts[0].y - 2);
  for (let i = 1; i < pts.length; i++) g.lineTo(pts[i].x, pts[i].y - 2);
  g.strokePath();

  // Bright grass tips
  g.lineStyle(2, 0x6ec06e, 1);
  g.beginPath();
  g.moveTo(pts[0].x, pts[0].y - 5);
  for (let i = 1; i < pts.length; i++) g.lineTo(pts[i].x, pts[i].y - 5);
  g.strokePath();

  // === Texture details: small rocks on dirt ===
  g.fillStyle(0x2a1a0a, 0.6);
  for (let i = 0; i < pts.length; i += 3) {
    if (Math.random() < 0.4) {
      const rx = pts[i].x + (Math.random() - 0.5) * 20;
      const ry = pts[i].y + 25 + Math.random() * 80;
      const sz = 2 + Math.random() * 3;
      g.fillCircle(rx, ry, sz);
    }
  }

  // Grass tufts sticking up
  g.lineStyle(2, 0x4ea84e, 1);
  for (let i = 2; i < pts.length; i += 5) {
    if (Math.random() < 0.5) {
      const tx = pts[i].x;
      const ty = pts[i].y - 4;
      g.beginPath();
      g.moveTo(tx, ty); g.lineTo(tx - 2, ty - 8);
      g.moveTo(tx, ty); g.lineTo(tx, ty - 10);
      g.moveTo(tx, ty); g.lineTo(tx + 2, ty - 8);
      g.strokePath();
    }
  }

  S.terrainFillGraphics = g;
}

// ============================================================
//  PHASER SCENE
// ============================================================
class OffroadScene extends Phaser.Scene {
  constructor() { super('offroad'); }

  preload() {
    // All graphics are procedural (no external assets)
  }

  create() {
    S.scene = this;
    this.physicsWorld = planck.World(planck.Vec2(0, CFG.GRAVITY_Y));
    S.world = this.physicsWorld;

    generateTextures(this);
    createParallax(this);

    // Terrain init
    S.terrainPoints = [];
    S.terrainSegmentsGenerated = 0;
    S.groundBodies = [];
    S.pickups = [];
    S.parallax.trees = [];
    extendTerrain(this, this.physicsWorld, 80);
    redrawTerrain(this);

    // Car
    const startX = 140, startY = CFG.TERRAIN_BASE_Y - 95;
    const car = createCar(this, this.physicsWorld, startX, startY);
    S.carBody = car.carBody;
    S.wheelBack = car.wheelBack;
    S.wheelFront = car.wheelFront;

    // === Car sprite (HCR-style, assembled from procedural textures) ===
    // carBody texture is 200x100, physics chassis center is (0,0) — top of body at y=-50
    // We want body bottom to align with chassis center (0,0); chassis sits at y=0 in container
    // So body texture center should be at y = -(50-22) = -28 (body bottom at +22 ≈ wheel center)
    S.carSprite = this.add.container(startX, startY);
    S.carSprite.setDepth(10);

    // Shadow under car (separate, follows car but no rotation)
    S.carShadow = this.add.ellipse(startX, startY + 42, 160, 22, 0x000000, 0.32);
    S.carShadow.setDepth(9);

    // Body sprite: texture is 200x100, origin at center
    // Chassis physics box is 120x32 centered at (0,0) — top at -16, bottom at +16
    // We want texture's body-bottom (y=58 in tex = +8 from center) to sit at chassis bottom (y=+16)
    // So image center y = 16 - (58-50) = 16 - 8 = 8 ... but we want body slightly above wheels
    // Wheels at y=+22 with radius 28 — top of wheel at y=-6. Body bottom should be ~y=+10.
    // Body bottom in texture is y=58 (tex), so image center = 10 - (58-50) = 10 - 8 = 2. Use 0.
    const bodyImg = this.add.image(0, 0, 'carBody');
    bodyImg.setOrigin(0.5, 0.5);
    // Driver head — sits in cabin window area (cabin y=8..28 in texture, center at 18; in container that's -32)
    const driverHead = this.add.image(2, -32, 'driver');
    driverHead.setOrigin(0.5, 0.5);
    driverHead.setScale(0.55);
    S.driverSprite = driverHead;
    S.carSprite.add([bodyImg, driverHead]);

    // Wheels — procedural texture, sized to physics radius
    const wheelTexRadius = 40; // texture is 80x80
    const wheelScale = CFG.WHEEL_RADIUS / wheelTexRadius;
    S.wheelBSprite = this.add.image(startX - 38, startY + 22, 'wheel');
    S.wheelBSprite.setDepth(11); S.wheelBSprite.setScale(wheelScale);
    S.wheelFSprite = this.add.image(startX + 38, startY + 22, 'wheel');
    S.wheelFSprite.setDepth(11); S.wheelFSprite.setScale(wheelScale);

    // === Particles ===
    S.exhaustEmitter = this.add.particles(0, 0, 'dust', {
      lifespan: 700,
      speed: {min: 30, max: 80},
      angle: {min: 160, max: 200},
      scale: {start: 0.5, end: 0.05},
      alpha: {start: 0.5, end: 0},
      tint: [0x666666, 0x888888, 0xaaaaaa],
      frequency: -1,
    });
    S.exhaustEmitter.setDepth(8);

    S.dirtEmitter = this.add.particles(0, 0, 'dust', {
      lifespan: 600,
      speed: {min: 100, max: 240},
      angle: {min: 220, max: 320},
      scale: {start: 0.6, end: 0.05},
      alpha: {start: 0.95, end: 0},
      tint: [0x6b4423, 0x8a5a33, 0x5a3a23, 0x7a4a24],
      frequency: -1,
    });
    S.dirtEmitter.setDepth(7);

    S.sparkEmitter = this.add.particles(0, 0, 'particle', {
      lifespan: 450,
      speed: {min: 60, max: 180},
      scale: {start: 0.7, end: 0.05},
      alpha: {start: 1, end: 0},
      tint: [0xffd700, 0xffe066, 0xffffff, 0xff8c1a],
      frequency: -1,
    });
    S.sparkEmitter.setDepth(20);

    // Dust on landing (big poof)
    S.dustEmitter = this.add.particles(0, 0, 'dust', {
      lifespan: 800,
      speed: {min: 40, max: 120},
      angle: {min: 200, max: 340},
      scale: {start: 1.0, end: 0.1},
      alpha: {start: 0.6, end: 0},
      tint: [0xc8a878, 0x9a8868, 0xb89868],
      frequency: -1,
    });
    S.dustEmitter.setDepth(6);

    // Camera
    this.cameras.main.setZoom(CFG.CAM_ZOOM);
    this.cameras.main.setBackgroundColor('#1a1f3a');

    // Vignette overlay
    S.vignette = this.add.graphics();
    S.vignette.setDepth(100);
    S.vignette.setScrollFactor(0);
    redrawVignette(this);

    this._setupInput();

    // Reset state
    S.fuel = CFG.FUEL_MAX;
    S.coins = 0;
    S.distance = 0;
    S.maxDistance = 0;
    S.flipTimer = 0;
    S.startedMoving = false;
    S.gameState = 'playing';
    S.shake = 0;

    S.audio = new GameAudio();
    S.audio.init();

    try {
      const best = parseInt(localStorage.getItem('dmitryLixxxBest') || '0');
      if (!isNaN(best)) S.best = best;
    } catch(e) {}

    document.getElementById('best-val').textContent = S.best + ' м';
    this._lastWheelAngle = 0;
    this._airborneTime = 0;
    this._wasAirborne = false;
    this._camSnapped = false;
  }

  _setupInput() {
    this.cursors = this.input.keyboard.createCursorKeys();
    this.keyW = this.input.keyboard.addKey('W');
    this.keyS = this.input.keyboard.addKey('S');
    this.keyA = this.input.keyboard.addKey('A');
    this.keyD = this.input.keyboard.addKey('D');
    this.keySpace = this.input.keyboard.addKey('SPACE');

    const gasBtn = document.getElementById('gas-pedal');
    const brakeBtn = document.getElementById('brake-pedal');
    const setGas = (v) => { S.inputGas = v; v ? gasBtn.classList.add('pressed') : gasBtn.classList.remove('pressed'); };
    const setBrake = (v) => { S.inputBrake = v; v ? brakeBtn.classList.add('pressed') : brakeBtn.classList.remove('pressed'); };
    const bind = (el, setter) => {
      el.addEventListener('touchstart', e => { e.preventDefault(); setter(true); S.audio && S.audio.resume(); }, {passive: false});
      el.addEventListener('touchend', e => { e.preventDefault(); setter(false); }, {passive: false});
      el.addEventListener('touchcancel', e => { e.preventDefault(); setter(false); }, {passive: false});
      el.addEventListener('mousedown', e => { e.preventDefault(); setter(true); S.audio && S.audio.resume(); });
      el.addEventListener('mouseup', e => { e.preventDefault(); setter(false); });
      el.addEventListener('mouseleave', e => { setter(false); });
    };
    bind(gasBtn, setGas);
    bind(brakeBtn, setBrake);
  }

  update(time, delta) {
    if (S.gameState !== 'playing') return;
    const dt = Math.min(delta / 1000, 1/30);

    // ===== Input =====
    const gasPressed = S.inputGas || this.cursors.right.isDown || this.keyD.isDown || this.keyW.isDown || this.keySpace.isDown;
    const brakePressed = S.inputBrake || this.cursors.left.isDown || this.keyA.isDown || this.keyS.isDown;

    if (gasPressed) {
      S.wheelJointBack.setMotorSpeed(CFG.MOTOR_SPEED);
      S.wheelJointFront.setMotorSpeed(CFG.MOTOR_SPEED);
      S.wheelJointBack.enableMotor(true);
      S.wheelJointFront.enableMotor(true);
      S.startedMoving = true;
    } else if (brakePressed) {
      S.wheelJointBack.setMotorSpeed(CFG.REVERSE_SPEED);
      S.wheelJointFront.setMotorSpeed(CFG.REVERSE_SPEED);
      S.wheelJointBack.enableMotor(true);
      S.wheelJointFront.enableMotor(true);
    } else {
      S.wheelJointBack.enableMotor(false);
      S.wheelJointFront.enableMotor(false);
    }

    // ===== Physics =====
    this.physicsWorld.step(CFG.PHYSICS_STEP, CFG.VEL_ITER, CFG.POS_ITER);

    // ===== Extend terrain =====
    const carX = S.carBody.getPosition().x;
    const segIdxNeeded = Math.floor((carX + 1500) / CFG.TERRAIN_STEP);
    if (segIdxNeeded > S.terrainSegmentsGenerated) {
      extendTerrain(this, this.physicsWorld, Math.min(segIdxNeeded + 20, 8000));
      redrawTerrain(this);
    }

    // ===== Sync sprites =====
    const cp = S.carBody.getPosition();
    const ca = S.carBody.getAngle();
    S.carSprite.x = cp.x;
    S.carSprite.y = cp.y;
    S.carSprite.rotation = ca;
    S.carShadow.x = cp.x;
    S.carShadow.y = cp.y + 50;
    S.carShadow.setScale(1 - Math.abs(ca) * 0.3, 1 - Math.abs(ca) * 0.5);
    S.carShadow.setAlpha(0.35 - Math.abs(ca) * 0.1);

    const wpb = S.wheelBack.getPosition();
    const wpa = S.wheelBack.getAngle();
    S.wheelBSprite.x = wpb.x; S.wheelBSprite.y = wpb.y; S.wheelBSprite.rotation = wpa;

    const wpf = S.wheelFront.getPosition();
    const wfa = S.wheelFront.getAngle();
    S.wheelFSprite.x = wpf.x; S.wheelFSprite.y = wpf.y; S.wheelFSprite.rotation = wfa;

    // Driver head bobble
    const angVel = S.carBody.getAngularVelocity();
    S.driverTargetRot = Phaser.Math.Clamp(-angVel * 0.05, -0.6, 0.6);
    S.driverSprite.rotation = Phaser.Math.Linear(S.driverSprite.rotation, S.driverTargetRot, 0.18);
    S.driverSprite.y = -32 + Math.sin(time * 0.006) * 1.8;

    // ===== Camera with shake =====
    const targetX = cp.x + CFG.CAM_OFFSET_X;
    const targetY = cp.y + CFG.CAM_OFFSET_Y;
    const cam = this.cameras.main;
    let shakeX = 0, shakeY = 0;
    if (S.shake > 0) {
      shakeX = (Math.random() - 0.5) * S.shake;
      shakeY = (Math.random() - 0.5) * S.shake;
      S.shake = Math.max(0, S.shake - dt * 30);
    }
    if (this._camSnapped !== true) {
      // Snap on first frame so the car starts on the LEFT third of the screen
      cam.scrollX = targetX - cam.width / 2 / CFG.CAM_ZOOM;
      cam.scrollY = targetY - cam.height / 2 / CFG.CAM_ZOOM;
      this._camSnapped = true;
    } else {
      cam.scrollX = Phaser.Math.Linear(cam.scrollX, targetX - cam.width / 2 / CFG.CAM_ZOOM + shakeX, CFG.CAM_LERP);
      cam.scrollY = Phaser.Math.Linear(cam.scrollY, targetY - cam.height / 2 / CFG.CAM_ZOOM + shakeY, CFG.CAM_LERP);
    }

    // ===== Fuel =====
    if (S.startedMoving) {
      const drain = (gasPressed ? CFG.FUEL_DRAIN_GAS : CFG.FUEL_DRAIN_IDLE) * dt;
      S.fuel = Math.max(0, S.fuel - drain);
      const fuelPct = (S.fuel / CFG.FUEL_MAX) * 100;
      const bar = document.getElementById('fuel-bar');
      bar.style.width = fuelPct + '%';
      if (fuelPct < 20) bar.classList.add('low'); else bar.classList.remove('low');
    }

    // ===== Pickups =====
    for (const p of S.pickups) {
      if (p.collected) continue;
      // Float animation
      p.sprite.y = p.baseY + Math.sin(time * 0.003 + p.phase) * 4;
      p.sprite.rotation = Math.sin(time * 0.002 + p.phase) * 0.15;

      const pp = p.body.getPosition();
      const dx = pp.x - cp.x;
      const dy = pp.y - cp.y;
      if (dx * dx + dy * dy < 55 * 55) {
        p.collected = true;
        p.sprite.destroy();
        if (p.type === 'coin') {
          S.coins += CFG.COIN_VALUE;
          S.audio && S.audio.coin();
          S.sparkEmitter.emitParticleAt(pp.x, pp.y, 14);
          document.getElementById('coins-val').textContent = S.coins;
        } else {
          S.fuel = Math.min(CFG.FUEL_MAX, S.fuel + CFG.FUEL_PICKUP);
          S.audio && S.audio.fuel();
          S.sparkEmitter.emitParticleAt(pp.x, pp.y, 22);
        }
      }
      if (pp.x < cam.scrollX - 600) {
        p.sprite.destroy();
        p.collected = true;
      }
    }

    // ===== Exhaust =====
    if (S.startedMoving && gasPressed && time - S.lastDirtTime > 50) {
      // Exhaust pipe is at back of car (left side), slightly below body
      const ex = cp.x - Math.cos(ca) * 95 + Math.sin(ca) * 10;
      const ey = cp.y - Math.sin(ca) * 95 - Math.cos(ca) * 10;
      S.exhaustEmitter.emitParticleAt(ex, ey, 1);
    }

    // ===== Dirt from wheels + airborne detection =====
    const wheelSpeed = Math.abs(S.wheelBack.getAngularVelocity());

    // Detect ground contact via wheel position vs terrain
    const wb = S.wheelBack.getPosition();
    const terrainYAtWheel = generateTerrainPoint(Math.floor(wb.x / CFG.TERRAIN_STEP) + 0.5);
    const isGrounded = (wb.y + CFG.WHEEL_RADIUS) > (terrainYAtWheel - 8);

    if (!isGrounded && S.startedMoving) {
      this._airborneTime += dt;
      this._wasAirborne = true;
    } else {
      if (this._wasAirborne && this._airborneTime > 0.4) {
        // Landing dust!
        S.dustEmitter.emitParticleAt(wb.x, wb.y + 10, 12);
        S.sparkEmitter.emitParticleAt(wb.x, wb.y, 6);
        S.shake = Math.min(12, this._airborneTime * 8);
      }
      this._airborneTime = 0;
      this._wasAirborne = false;
    }

    if (S.startedMoving && isGrounded && wheelSpeed > 4 && time - S.lastDirtTime > 40) {
      S.lastDirtTime = time;
      const count = Math.min(5, Math.floor(wheelSpeed / 3));
      S.dirtEmitter.emitParticleAt(wb.x, wb.y + CFG.WHEEL_RADIUS - 4, count);
    }

    // ===== Audio =====
    if (S.startedMoving) S.audio.setEngine(gasPressed ? 1 : 0.2, wheelSpeed);

    // ===== Distance =====
    S.distance = Math.max(S.distance, Math.floor((cp.x - 120) / 10));
    if (S.distance > S.maxDistance) S.maxDistance = S.distance;
    document.getElementById('distance-val').textContent = S.distance + ' м';

    // ===== Game over checks =====
    if (S.fuel <= 0 && Math.abs(S.carBody.getLinearVelocity().x) < 5) {
      this._gameOver('Закончилось топливо!');
      return;
    }
    const carAngle = Math.abs(((ca * 180 / Math.PI) % 360 + 360) % 360);
    const flipped = (carAngle > 100 && carAngle < 260);
    if (flipped) {
      S.flipTimer += dt;
      if (S.flipTimer > 1.8) {
        this._gameOver('Нива на крыле! Не вытянул.');
        return;
      }
    } else {
      S.flipTimer = 0;
    }
    const headWorldX = cp.x + Math.sin(ca) * 40;
    const headWorldY = cp.y - Math.cos(ca) * 40;
    const terrainSegIdx = Math.floor(headWorldX / CFG.TERRAIN_STEP);
    if (terrainSegIdx >= 0 && terrainSegIdx < S.terrainPoints.length) {
      const tp = S.terrainPoints[terrainSegIdx];
      if (headWorldY > tp.y - 5) {
        this._gameOver('Дмитрий ударился головой!');
        return;
      }
    }
    if (cp.y > 1500) {
      this._gameOver('Нива улетела в бездну!');
      return;
    }
  }

  _gameOver(reason) {
    if (S.gameState !== 'playing') return;
    S.gameState = 'gameover';
    S.audio && S.audio.crash();
    S.audio && S.audio.stopEngine();
    S.shake = 16;
    if (S.maxDistance > S.best) {
      S.best = S.maxDistance;
      try { localStorage.setItem('dmitryLixxxBest', S.best.toString()); } catch(e) {}
    }
    const score = S.maxDistance + S.coins * 5;
    document.getElementById('game-over-reason').textContent = reason;
    document.getElementById('final-distance').textContent = S.maxDistance + ' м';
    document.getElementById('final-coins').textContent = S.coins;
    document.getElementById('final-best').textContent = S.best + ' м';
    document.getElementById('final-score').textContent = score;
    document.getElementById('game-over').classList.add('show');
  }

  shutdown() { if (S.audio) S.audio.stopEngine(); }
}

function redrawVignette(scene) {
  const g = S.vignette;
  const w = scene.cameras.main.width;
  const h = scene.cameras.main.height;
  g.clear();
  // Radial vignette (4 corner rectangles + soft edges)
  const steps = 12;
  for (let i = 0; i < steps; i++) {
    const t = i / steps;
    const alpha = Math.pow(t, 2) * 0.5;
    const inset = t * 60;
    g.fillStyle(0x000000, alpha / steps);
    g.fillRect(0, 0, w, inset);
    g.fillRect(0, h - inset, w, inset);
    g.fillRect(0, 0, inset, h);
    g.fillRect(w - inset, 0, inset, h);
  }
}

// ============================================================
//  BOOTSTRAP
// ============================================================
let phaserGame = null;
window.addEventListener('load', () => {
  const config = {
    type: Phaser.AUTO,
    parent: 'game-container',
    width: window.innerWidth, height: window.innerHeight,
    backgroundColor: '#1a1f3a',
    scale: { mode: Phaser.Scale.RESIZE, autoCenter: Phaser.Scale.CENTER_BOTH },
    render: { antialias: true, pixelArt: false, roundPixels: false },
    physics: { default: 'arcade', arcade: { gravity: {y: 0}, debug: false } },
    scene: [OffroadScene],
  };
  phaserGame = new Phaser.Game(config);

  setTimeout(() => {
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('start-screen').classList.remove('hidden');
  }, 800);

  window.addEventListener('resize', () => {
    if (phaserGame) phaserGame.scale.resize(window.innerWidth, window.innerHeight);
  });

  document.getElementById('start-btn').addEventListener('click', () => {
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('hud').style.display = 'flex';
    document.getElementById('touch-controls').style.display = 'flex';
    if (S.audio) S.audio.resume();
  });

  document.getElementById('restart-btn').addEventListener('click', () => {
    document.getElementById('game-over').classList.remove('show');
    phaserGame.scene.stop('offroad');
    phaserGame.scene.start('offroad');
  });
});

document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('gesturechange', e => e.preventDefault());
document.addEventListener('gestureend', e => e.preventDefault());
</script>
